,\"stage\":\"finish\",\"title\":\"Finish the binding\",\"text\":\"Wrap the binding to the back so its fold just covers the stitching. Slip-stitch by hand, or stitch in the ditch from the front.\",\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":50,\"y\":90,\"w\":300,\"h\":120,\"tone\":\"bind\"},{\"k\":\"stitch\",\"pts\":[[70,84],[78,98]]},{\"k\":\"stitch\",\"pts\":[[86,84],[94,98]]},{\"k\":\"stitch\",\"pts\":[[102,84],[110,98]]},{\"k\":\"stitch\",\"pts\":[[118,84],[126,98]]},{\"k\":\"stitch\",\"pts\":[[134,84],[142,98]]},{\"k\":\"stitch\",\"pts\":[[150,84],[158,98]]},{\"k\":\"stitch\",\"pts\":[[166,84],[174,98]]},{\"k\":\"stitch\",\"pts\":[[182,84],[190,98]]},{\"k\":\"stitch\",\"pts\":[[198,84],[206,98]]},{\"k\":\"stitch\",\"pts\":[[214,84],[222,98]]},{\"k\":\"stitch\",\"pts\":[[230,84],[238,98]]},{\"k\":\"stitch\",\"pts\":[[246,84],[254,98]]},{\"k\":\"stitch\",\"pts\":[[262,84],[270,98]]},{\"k\":\"stitch\",\"pts\":[[278,84],[286,98]]},{\"k\":\"stitch\",\"pts\":[[294,84],[302,98]]},{\"k\":\"stitch\",\"pts\":[[310,84],[318,98]]},{\"k\":\"stitch\",\"pts\":[[326,84],[334,98]]},{\"k\":\"label\",\"x\":200,\"y\":250,\"text\":\"whip stitch, 3–5 mm long\",\"anchor\":\"middle\"}]}},\"pieces\":[\"binding\"],\"techniques\":[\"binding\",\"ladder-stitch\"],\"expert\":\"Wrap the binding to the back so its fold just covers the stitching.\",\"alt\":\"A whip stitch sewn by hand along an edge.\"},{\"id\":\"h11\",\"stage\":\"finish\",\"title\":\"Done\",\"text\":\"Press lightly.\",\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":100,\"y\":60,\"w\":200,\"h\":200,\"tone\":\"bind\",\"rx\":6},{\"k\":\"panel\",\"x\":110,\"y\":70,\"w\":180,\"h\":180,\"tone\":\"main\"},{\"k\":\"stitch\",\"pts\":[[146,70],[146,250]]},{\"k\":\"stitch\",\"pts\":[[182,70],[182,250]]},{\"k\":\"stitch\",\"pts\":[[218,70],[218,250]]},{\"k\":\"stitch\",\"pts\":[[254,70],[254,250]]},{\"k\":\"stitch\",\"pts\":[[110,106],[290,106]]},{\"k\":\"stitch\",\"pts\":[[110,142],[290,142]]},{\"k\":\"stitch\",\"pts\":[[110,178],[290,178]]},{\"k\":\"stitch\",\"pts\":[[110,214],[290,214]]},{\"k\":\"cord\",\"pts\":[[104,64],[80,40],[100,30],[112,58]],\"color\":\"bind\"},{\"k\":\"label\",\"x\":200,\"y\":292,\"text\":\"Finished!\",\"anchor\":\"middle\",\"bold\":true}]}},\"expert\":\"Press lightly.\",\"alt\":\"The finished Quilted Pot Holder.\"}],\"gallery\":[{\"label\":\"Pot holder\",\"scene\":{\"els\":[\"$5:props:children:props:project:steps:10:visual:scene:els:0\",\"$5:props:children:props:project:steps:10:visual:scene:els:1\",\"$5:props:children:props:project:steps:10:visual:scene:els:2\",\"$5:props:children:props:project:steps:10:visual:scene:els:3\",\"$5:props:children:props:project:steps:10:visual:scene:els:4\",\"$5:props:children:props:project:steps:10:visual:scene:els:5\",\"$5:props:children:props:project:steps:10:visual:scene:els:6\",\"$5:props:children:props:project:steps:10:visual:scene:els:7\",\"$5:props:children:props:project:steps:10:visual:scene:els:8\",\"$5:props:children:props:project:steps:10:visual:scene:els:9\",\"$5:props:children:props:project:steps:10:visual:scene:els:10\"]}}],\"review\":{\"status\":\"published\",\"technicallyValidated\":false,\"updated\":\"2026-11-14\",\"reviewer\":\"SewCraft editorial (sample)\",\"note\":\"Sample pattern; dimensions are internally consistent but not yet test-sewn.\"},\"customizable\":false,\"techniques\":[\"quilting\",\"binding\",\"pressing\",\"ladder-stitch\"]},\"techniques\":[{\"id\":\"prewash\",\"name\":\"Pre-washing fabric\",\"summary\":\"Wash fabric the way you'll wash the finished item, before you cut.\"},{\"id\":\"pressing\",\"name\":\"Pressing\",\"summary\":\"Lift-and-lower ironing that sets seams and folds precisely.\"},{\"id\":\"straight-stitch\",\"name\":\"Straight stitch\",\"summary\":\"The everyday machine stitch for seams.\"},{\"id\":\"zigzag-stitch\",\"name\":\"Zigzag stitch\",\"summary\":\"Side-to-side stitch for neatening raw edges and sewing elastic.\"},{\"id\":\"backstitching\",\"name\":\"Backstitching\",\"summary\":\"Lock every seam so it can't unravel.\"},{\"id\":\"seam-allowance\",\"name\":\"Seam allowances \u0026 right sides together\",\"summary\":\"Where to stitch, and which way the fabric faces.\"},{\"id\":\"edgestitching\",\"name\":\"Edgestitching\",\"summary\":\"Stitching 2–3 mm from a fold for crisp edges.\"},{\"id\":\"topstitching\",\"name\":\"Topstitching\",\"summary\":\"Visible stitching that strengthens and decorates.\"},{\"id\":\"boxed-corners\",\"name\":\"Boxed corners\",\"summary\":\"Give a flat bag a base and depth.\"},{\"id\":\"lining\",\"name\":\"Lining a bag\",\"summary\":\"A clean inside finish with no exposed seams.\"},{\"id\":\"attaching-straps\",\"name\":\"Attaching straps\",\"summary\":\"Position and secure handles so they last.\"},{\"id\":\"clipping-corners\",\"name\":\"Clipping corners \u0026 curves\",\"summary\":\"Reduce bulk so corners turn out sharp.\"},{\"id\":\"ladder-stitch\",\"name\":\"Turning gap \u0026 ladder stitch\",\"summary\":\"Close an opening invisibly by hand.\"},{\"id\":\"zipper\",\"name\":\"Installing a zipper (sandwich method)\",\"summary\":\"Outer + zipper + lining sewn in one pass.\"},{\"id\":\"casing\",\"name\":\"Making a casing\",\"summary\":\"A channel for elastic or a drawstring.\"},{\"id\":\"elastic-waistband\",\"name\":\"Elastic waistband\",\"summary\":\"Cut, thread and join elastic for a comfortable fit.\"},{\"id\":\"hemming\",\"name\":\"Double-fold hem\",\"summary\":\"Enclose the raw edge in two folds.\"},{\"id\":\"finishing-edges\",\"name\":\"Finishing raw edges\",\"summary\":\"Stop seams fraying inside unlined projects.\"},{\"id\":\"interfacing\",\"name\":\"Using fusible interfacing\",\"summary\":\"Add body to soft fabrics.\"},{\"id\":\"french-seam\",\"name\":\"French seams\",\"summary\":\"A seam that encloses its own raw edges — no fraying, no overlocker.\"},{\"id\":\"quilting\",\"name\":\"Quilting the layers\",\"summary\":\"Stitching through top, batting and backing so they act as one.\"},{\"id\":\"binding\",\"name\":\"Double-fold binding\",\"summary\":\"A folded strip that wraps and finishes a quilted edge.\"},{\"id\":\"gathering\",\"name\":\"Gathering\",\"summary\":\"Two rows of long stitches pulled to ruffle fabric evenly.\"},{\"id\":\"sewing-curves\",\"name\":\"Sewing curves\",\"summary\":\"Smooth curved seams without puckers.\"},{\"id\":\"staystitching\",\"name\":\"Staystitching\",\"summary\":\"A line of stitching that stops curved edges stretching.\"},{\"id\":\"eyelets\",\"name\":\"Installing eyelets\",\"summary\":\"Metal grommets for drawstrings and laces.\"},{\"id\":\"buttonholes\",\"name\":\"Buttonholes \u0026 buttons\",\"summary\":\"Machine buttonholes and sewing on a button with a shank.\"},{\"id\":\"adjustable-strap\",\"name\":\"Adjustable straps\",\"summary\":\"D-rings and a slider for a strap you can lengthen.\"}],\"glossary\":[{\"term\":\"right sides together\",\"aliases\":[\"RST\"],\"definition\":\"Place two pieces so their printed / 'good' faces touch. You sew on the wrong side, then turn the item so the seam is hidden.\",\"technique\":\"seam-allowance\"},{\"term\":\"wrong side\",\"definition\":\"The back face of the fabric — the side that ends up hidden inside the finished item.\"},{\"term\":\"right side\",\"definition\":\"The front, 'good' face of the fabric that shows on the finished item.\"},{\"term\":\"seam allowance\",\"definition\":\"The distance between the cut edge of the fabric and the stitching line.\",\"technique\":\"seam-allowance\"},{\"term\":\"backstitch\",\"aliases\":[\"backstitching\"],\"definition\":\"Sew 3–4 stitches in reverse and then forward again at the start and end of a seam to lock the threads.\",\"technique\":\"backstitching\"},{\"term\":\"press\",\"aliases\":[\"pressing\"],\"definition\":\"Lift and lower the iron onto the fabric rather than sliding it, so pieces don't stretch out of shape.\",\"technique\":\"pressing\"},{\"term\":\"edgestitch\",\"aliases\":[\"edgestitching\"],\"definition\":\"A line of stitching very close (2–3 mm) to a folded edge or seam.\",\"technique\":\"edgestitching\"},{\"term\":\"topstitch\",\"aliases\":[\"topstitching\"],\"definition\":\"A visible line of stitching on the right side, usually 5–7 mm from an edge, for strength and a crisp finish.\",\"technique\":\"topstitching\"},{\"term\":\"baste\",\"aliases\":[\"basting\"],\"definition\":\"Temporary long stitches that hold layers in place; they're hidden inside a later seam.\"},{\"term\":\"grainline\",\"aliases\":[\"grain\"],\"definition\":\"The direction of the threads that run parallel to the selvedge. Pieces cut on grain hang straight and don't twist.\"},{\"term\":\"selvedge\",\"definition\":\"The tightly woven finished edges running along both sides of the fabric length. They don't fray.\"},{\"term\":\"on the fold\",\"definition\":\"Place the edge of the pattern piece exactly on the folded edge of the fabric so it opens into one symmetrical piece.\"},{\"term\":\"clip the corners\",\"aliases\":[\"clip corners\"],\"definition\":\"Snip diagonally across the seam allowance at a corner (without cutting the stitches) so it turns out sharp.\",\"technique\":\"clipping-corners\"},{\"term\":\"casing\",\"definition\":\"A folded tunnel of fabric that holds elastic or a drawstring.\",\"technique\":\"casing\"},{\"term\":\"interfacing\",\"definition\":\"A stabilising layer fused or sewn to the wrong side of fabric to add body.\",\"technique\":\"interfacing\"},{\"term\":\"raw edge\",\"aliases\":[\"raw edges\"],\"definition\":\"A cut edge of fabric that isn't finished and can fray.\"},{\"term\":\"boxed corners\",\"aliases\":[\"box the corners\"],\"definition\":\"Corners sewn across so a flat bag gets depth and a flat bottom.\",\"technique\":\"boxed-corners\"},{\"term\":\"zipper foot\",\"definition\":\"A narrow presser foot that lets the needle sew right next to zipper teeth.\",\"technique\":\"zipper\"},{\"term\":\"ladder stitch\",\"definition\":\"An invisible hand stitch that closes an opening from the outside.\",\"technique\":\"ladder-stitch\"},{\"term\":\"turning gap\",\"definition\":\"A section of a seam left unsewn so you can turn the item right side out.\",\"technique\":\"ladder-stitch\"},{\"term\":\"zigzag\",\"definition\":\"A side-to-side machine stitch used to stop raw edges fraying or to sew stretchy elastic.\",\"technique\":\"zigzag-stitch\"},{\"term\":\"pivot\",\"definition\":\"Stop with the needle down in the fabric, lift the presser foot, turn the fabric, lower the foot and continue.\"}]}]}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#faf6ef\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[27201,[\"/sewcraft/_next/static/chunks/ff1a16fafef87110.js\",\"/sewcraft/_next/static/chunks/7d5fd19a460be294.js\"],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Sewing: Quilted Pot Holder · SewCraft\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Discover, prepare, measure, cut and sew — guided sewing projects with accurate patterns.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/sewcraft/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"3\",{\"rel\":\"icon\",\"href\":\"/sewcraft/favicon.ico?favicon.0b3bf435.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L11\",\"4\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
