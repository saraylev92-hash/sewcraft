\",\"definition\":\"A side-to-side machine stitch used to stop raw edges fraying or to sew stretchy elastic.\",\"technique\":\"zigzag-stitch\"},{\"term\":\"pivot\",\"definition\":\"Stop with the needle down in the fabric, lift the presser foot, turn the fabric, lower the foot and continue.\"}]}]}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#faf6ef\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[27201,[\"/sewcraft/_next/static/chunks/ff1a16fafef87110.js\",\"/sewcraft/_next/static/chunks/7d5fd19a460be294.js\"],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Sewing: Crayon Roll · SewCraft\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Discover, prepare, measure, cut and sew — guided sewing projects with accurate patterns.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/sewcraft/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"3\",{\"rel\":\"icon\",\"href\":\"/sewcraft/favicon.ico?favicon.0b3bf435.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L11\",\"4\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
