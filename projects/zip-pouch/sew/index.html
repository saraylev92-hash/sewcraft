\"name\":\"Zipper tab\",\"materialId\":\"main\",\"quantity\":2,\"width\":5,\"height\":8,\"seamAllowance\":0,\"grain\":\"any\",\"color\":\"#B8823F\"},{\"id\":\"lining\",\"name\":\"Lining panel\",\"materialId\":\"lining\",\"quantity\":2,\"width\":\"W + D + 2*sa\",\"height\":\"H + D/2 + 2*sa\",\"seamAllowance\":\"sa\",\"grain\":\"lengthwise\",\"markings\":[\"Cut a {D/2} square from both bottom corners\"],\"color\":\"#7E98A8\"},{\"id\":\"intf\",\"name\":\"Interfacing panel\",\"materialId\":\"interfacing\",\"quantity\":2,\"width\":\"W + D\",\"height\":\"H + D/2\",\"seamAllowance\":0,\"grain\":\"any\",\"notes\":\"Cut without seam allowance to reduce bulk; centre it on the outer panel.\",\"color\":\"#CFC8BA\"}],\"steps\":[{\"id\":\"p1\",\"stage\":\"prep\",\"title\":\"Press fabrics and check your zipper\",\"text\":\"Press both fabrics. Measure your zipper: the teeth (not the tape) must be at least as long as the measurement shown — it gets trimmed later, so longer is fine.\",\"beginner\":\"Coil zippers (with a plastic spiral) can be cut with ordinary scissors. Metal-tooth zippers can't be sewn over — don't use them for this project.\",\"expert\":\"Press; zipper ≥ shown length (coil).\",\"measurements\":[{\"label\":\"Minimum zipper length\",\"value\":\"W + D + 4\",\"unit\":\"len\"}],\"techniques\":[\"pressing\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"zip\",\"x\":50,\"y\":140,\"w\":300},{\"k\":\"dim\",\"from\":[50,180],\"to\":[350,180],\"value\":\"W + D + 4\"},{\"k\":\"label\",\"x\":200,\"y\":100,\"text\":\"coil zipper ≥ this length\",\"anchor\":\"middle\",\"bold\":true}]}},\"alt\":\"A coil zipper with its minimum length dimensioned.\"},{\"id\":\"p2\",\"stage\":\"cut\",\"title\":\"Cut the outer panels and tabs\",\"text\":\"Fold the outer fabric lengthwise and cut two outer panels and the two zipper tabs following the layout.\",\"expert\":\"Cut 2 outer + 2 tabs.\",\"pieces\":[\"outer\",\"tab\"],\"warnings\":[\"Keep blades closed and pointed away from you when not cutting.\"],\"visual\":{\"type\":\"layout\",\"materialId\":\"main\"},\"alt\":\"Cutting layout for the outer fabric with two panels and two small tabs.\"},{\"id\":\"p3\",\"stage\":\"cut\",\"title\":\"Cut the lining panels\",\"text\":\"Fold the lining and cut two lining panels the same size as the outer panels.\",\"expert\":\"Cut 2 lining.\",\"pieces\":[\"lining\"],\"visual\":{\"type\":\"layout\",\"materialId\":\"lining\"},\"alt\":\"Cutting layout for the lining fabric.\"},{\"id\":\"p4\",\"stage\":\"cut\",\"title\":\"Cut the interfacing\",\"text\":\"Cut two interfacing panels. They are smaller than the outer panels — this keeps the seams less bulky.\",\"beginner\":\"Interfacing has a glue side (slightly shiny or bumpy). It doesn't matter which way up you cut it.\",\"expert\":\"Cut 2 interfacing (no SA).\",\"pieces\":[\"intf\"],\"visual\":{\"type\":\"layout\",\"materialId\":\"interfacing\"},\"alt\":\"Cutting layout for the interfacing.\"},{\"id\":\"p5\",\"stage\":\"cut\",\"title\":\"Cut the corner squares\",\"text\":\"Cut a square from both bottom corners of every outer and lining panel, measured from the raw edges.\",\"expert\":\"Remove D/2 squares, outer + lining.\",\"pieces\":[\"outer\",\"lining\"],\"measurements\":[{\"label\":\"Corner square\",\"value\":\"D/2\",\"unit\":\"len\"}],\"techniques\":[\"boxed-corners\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":70,\"y\":60,\"w\":260,\"h\":170,\"tone\":\"main\",\"side\":\"wrong\",\"notch\":34},{\"k\":\"cutout\",\"x\":70,\"y\":196,\"s\":34},{\"k\":\"cutout\",\"x\":296,\"y\":196,\"s\":34},{\"k\":\"dim\",\"from\":[70,250],\"to\":[104,250],\"value\":\"D/2\"},{\"k\":\"label\",\"x\":200,\"y\":40,\"text\":\"outer ×2 · lining ×2\",\"anchor\":\"middle\",\"bold\":true}]}},\"alt\":\"A panel with squares cut from both bottom corners.\"},{\"id\":\"p6\",\"stage\":\"sew\",\"title\":\"Fuse the interfacing\",\"text\":\"Centre an interfacing panel, glue side down, on the wrong side of each outer panel, 1 cm in from every edge. Cover with a damp pressing cloth and press for 10–15 seconds in each spot without sliding. Let them cool flat.\",\"beginner\":\"Lift the iron and put it down in the next spot, overlapping slightly. Sliding causes wrinkles that can't be undone once cool.\",\"expert\":\"Fuse interfacing to outer WS, 1 cm inset.\",\"pieces\":[\"intf\",\"outer\"],\"measurements\":[{\"label\":\"Inset from edges\",\"value\":\"sa\",\"unit\":\"len\"}],\"techniques\":[\"interfacing\"],\"timerMin\":1,\"warnings\":[\"Hot iron and steam — use a pressing cloth and keep fingers clear.\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":70,\"y\":80,\"w\":260,\"h\":170,\"tone\":\"main\",\"side\":\"wrong\",\"notch\":34},{\"k\":\"panel\",\"x\":80,\"y\":90,\"w\":240,\"h\":150,\"tone\":\"intf\",\"notch\":24,\"label\":\"glue side down\"},{\"k\":\"iron\",\"x\":200,\"y\":48},{\"k\":\"dim\",\"from\":[70,270],\"to\":[80,270],\"value\":\"sa\",\"offset\":0}]}},\"alt\":\"Interfacing centred on the wrong side of an outer panel with a one-centimetre margin and an iron above.\"},{\"id\":\"p7\",\"stage\":\"sew\",\"title\":\"Add tabs to the zipper ends\",\"text\":\"Trim the zipper so that, with the tabs attached, it spans the length shown. Fold each tab in half, wrong sides together (short ends meeting), then open, fold each short end in to the centre crease and fold again so it wraps the zipper end. Edgestitch across each tab.\",\"beginner\":\"Before trimming, move the zipper pull to the middle so it doesn't fall off. Sew slowly over the coil; hand-turn the wheel if needed.\",\"expert\":\"Trim zip; wrap ends with folded tabs; total span = W + D.\",\"pieces\":[\"tab\"],\"measurements\":[{\"label\":\"Zipper + tabs total\",\"value\":\"W + D\",\"unit\":\"len\"}],\"techniques\":[\"edgestitching\"],\"warnings\":[\"Move the pull to the centre before cutting the zipper.\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"zip\",\"x\":80,\"y\":140,\"w\":240},{\"k\":\"panel\",\"x\":54,\"y\":126,\"w\":30,\"h\":36,\"tone\":\"tab\"},{\"k\":\"panel\",\"x\":316,\"y\":126,\"w\":30,\"h\":36,\"tone\":\"tab\"},{\"k\":\"stitch\",\"pts\":[[80,126],[80,162]]},{\"k\":\"stitch\",\"pts\":[[320,126],[320,162]]},{\"k\":\"dim\",\"from\":[54,200],\"to\":[346,200],\"value\":\"W + D\"}]}},\"alt\":\"A zipper with a folded fabric tab stitched over each end, the total length dimensioned.\"},{\"id\":\"p8\",\"stage\":\"sew\",\"title\":\"Sew the first side of the zipper\",\"text\":\"Lay one outer panel right side up. Place the zipper face down on it, tape edge level with the top edge, centred. Lay a lining panel right side down on top, matching the top edge. Clip. With the zipper foot, sew through all layers 1 cm from the edge. When you near the pull, stop with the needle down, lift the foot, slide the pull behind the foot, and continue.\",\"beginner\":\"Three layers: outer (face up), zipper (face down), lining (face down). The zipper is sandwiched with its teeth facing the outer.\",\"expert\":\"Outer RS up / zip face down / lining RS down; sew 1 cm with zipper foot.\",\"pieces\":[\"outer\",\"lining\"],\"measurements\":[{\"label\":\"Seam from top edge\",\"value\":\"sa\",\"unit\":\"len\"}],\"techniques\":[\"zipper\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":60,\"y\":120,\"w\":280,\"h\":140,\"tone\":\"main\"},{\"k\":\"zip\",\"x\":60,\"y\":112,\"w\":280},{\"k\":\"panel\",\"x\":60,\"y\":104,\"w\":280,\"h\":44,\"tone\":\"lining\",\"side\":\"wrong\",\"dim\":true,\"label\":\"lining face down\"},{\"k\":\"stitch\",\"pts\":[[60,126],[220,126]]},{\"k\":\"foot\",\"x\":232,\"y\":126},{\"k\":\"label\",\"x\":200,\"y\":290,\"text\":\"outer face up · zipper face down · lining face down\",\"anchor\":\"middle\"}]}},\"alt\":\"Outer panel, zipper and lining stacked along the top edge with stitching one centimetre down.\"},{\"id\":\"p9\",\"stage\":\"sew\",\"title\":\"Sew the second side\",\"text\":\"Fold the outer and lining away from the zipper. Repeat the sandwich on the other zipper tape with the second outer panel (right side up, under the zipper) and second lining panel (right side down on top). Line up the side edges with the first side, clip and sew.\",\"expert\":\"Repeat on the other tape, aligning sides.\",\"pieces\":[\"outer\",\"lining\"],\"measurements\":[{\"label\":\"Seam from top edge\",\"value\":\"sa\",\"unit\":\"len\"}],\"techniques\":[\"zipper\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":60,\"y\":30,\"w\":280,\"h\":100,\"tone\":\"main\"},{\"k\":\"zip\",\"x\":60,\"y\":136,\"w\":280},{\"k\":\"panel\",\"x\":60,\"y\":148,\"w\":280,\"h\":110,\"tone\":\"main\"},{\"k\":\"stitch\",\"pts\":[[60,154],[340,154]]},{\"k\":\"label\",\"x\":200,\"y\":285,\"text\":\"match side edges before sewing\",\"anchor\":\"middle\"}]}},\"alt\":\"Both outer panels attached to either side of the zipper, edges aligned.\"},{\"id\":\"p10\",\"stage\":\"sew\",\"title\":\"Press and topstitch along the zipper\",\"text\":\"Press the outer and lining away from the zipper on both sides so the fabric folds sit 3 mm from the teeth. Topstitch along each side, 3 mm from the fold, through outer and lining.\",\"beginner\":\"Topstitching stops the fabric from getting caught in the zipper pull.\",\"expert\":\"Press; topstitch 3 mm both sides.\",\"pieces\":[\"outer\",\"lining\"],\"measurements\":[{\"label\":\"Topstitch from fold\",\"value\":3,\"unit\":\"mm\"}],\"techniques\":[\"topstitching\",\"pressing\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":60,\"y\":40,\"w\":280,\"h\":100,\"tone\":\"main\"},{\"k\":\"zip\",\"x\":60,\"y\":140,\"w\":280},{\"k\":\"panel\",\"x\":60,\"y\":160,\"w\":280,\"h\":100,\"tone\":\"main\"},{\"k\":\"stitch\",\"pts\":[[60,134],[340,134]]},{\"k\":\"stitch\",\"pts\":[[60,166],[340,166]]},{\"k\":\"foot\",\"x\":240,\"y\":166}]}},\"alt\":\"Topstitching lines just beside both sides of the zipper.\"},{\"id\":\"p11\",\"stage\":\"assemble\",\"title\":\"Sew outer to outer, lining to lining\",\"text\":\"OPEN THE ZIPPER at least halfway. Bring the two outer panels right sides together and the two lining panels right sides together, with the zipper folded towards the lining (teeth facing the lining). Clip. Sew down the sides and across the bottoms with a 1 cm seam, leaving an 8 cm gap in the lining bottom and leaving all corner squares open.\",\"beginner\":\"If you forget to open the zipper, you can't turn the pouch. At the zipper, make sure the tabs point towards the lining and the zipper tapes lie flat.\",\"expert\":\"Open zip; outer RST + lining RST; sew all round except corners and 8 cm lining gap.\",\"pieces\":[\"outer\",\"lining\"],\"measurements\":[{\"label\":\"Seam allowance\",\"value\":\"sa\",\"unit\":\"len\"},{\"label\":\"Turning gap\",\"value\":8,\"unit\":\"len\"}],\"techniques\":[\"seam-allowance\",\"backstitching\"],\"warnings\":[\"Open the zipper first!\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":20,\"y\":80,\"w\":180,\"h\":130,\"tone\":\"main\",\"side\":\"wrong\",\"notch\":22,\"label\":\"outer RST\"},{\"k\":\"panel\",\"x\":200,\"y\":80,\"w\":180,\"h\":130,\"tone\":\"lining\",\"side\":\"wrong\",\"notch\":22,\"label\":\"lining RST\"},{\"k\":\"zip\",\"x\":194,\"y\":80,\"w\":12,\"open\":true},{\"k\":\"stitch\",\"pts\":[[30,80],[30,188]]},{\"k\":\"stitch\",\"pts\":[[42,200],[190,200]]},{\"k\":\"stitch\",\"pts\":[[370,80],[370,188]]},{\"k\":\"stitch\",\"pts\":[[210,200],[250,200]]},{\"k\":\"stitch\",\"pts\":[[310,200],[358,200]]},{\"k\":\"gap\",\"from\":[250,222],\"to\":[310,222],\"label\":\"8 cm gap\"},{\"k\":\"label\",\"x\":200,\"y\":50,\"text\":\"zipper OPEN\",\"anchor\":\"middle\",\"bold\":true}]}},\"alt\":\"Outer panels and lining panels each placed right sides together side by side, sewn around except a gap in the lining bottom.\"},{\"id\":\"p12\",\"stage\":\"assemble\",\"title\":\"Box all four corners\",\"text\":\"Box each of the four corners (two outer, two lining): match the side seam to the bottom seam, flatten, and sew across with a 1 cm seam. Backstitch.\",\"expert\":\"Box 4 corners at 1 cm.\",\"pieces\":[\"outer\",\"lining\"],\"measurements\":[{\"label\":\"Boxing seam = depth\",\"value\":\"D\",\"unit\":\"len\"}],\"techniques\":[\"boxed-corners\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"poly\",\"pts\":[[200,50],[320,220],[80,220]],\"tone\":\"main\",\"side\":\"wrong\"},{\"k\":\"fold\",\"from\":[200,50],\"to\":[200,220],\"label\":\"seams matched\"},{\"k\":\"stitch\",\"pts\":[[94,206],[306,206]]},{\"k\":\"dim\",\"from\":[94,250],\"to\":[306,250],\"value\":\"D\"}]}},\"alt\":\"A corner pinched with seams aligned and stitched across to box it.\"},{\"id\":\"p13\",\"stage\":\"finish\",\"title\":\"Turn, close the gap and shape\",\"text\":\"Turn the pouch right side out through the lining gap and through the open zipper. Push out the corners. Close the lining gap with edgestitching or a ladder stitch and push the lining inside.\",\"expert\":\"Turn, close gap, shape.\",\"pieces\":[\"lining\"],\"techniques\":[\"ladder-stitch\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":90,\"y\":60,\"w\":220,\"h\":150,\"tone\":\"lining\",\"side\":\"wrong\"},{\"k\":\"gap\",\"from\":[170,210],\"to\":[230,210],\"label\":\"pull pouch through\"},{\"k\":\"arrow\",\"from\":[200,180],\"to\":[200,275]}]}},\"alt\":\"The pouch being pulled through the lining gap.\"},{\"id\":\"p14\",\"stage\":\"finish\",\"title\":\"Final press\",\"text\":\"Press the pouch, using a rolled towel inside to shape it. Check the zipper runs smoothly end to end.\",\"expert\":\"Press over a towel roll; test zipper.\",\"pieces\":[\"outer\"],\"techniques\":[\"pressing\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":90,\"y\":110,\"w\":220,\"h\":140,\"tone\":\"main\",\"rx\":8},{\"k\":\"zip\",\"x\":90,\"y\":104,\"w\":220},{\"k\":\"panel\",\"x\":72,\"y\":98,\"w\":22,\"h\":20,\"tone\":\"tab\"},{\"k\":\"focus\",\"x\":200,\"y\":108,\"r\":30}]}},\"alt\":\"The finished pouch with its zipper highlighted.\"}],\"gallery\":[{\"label\":\"Front\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":90,\"y\":110,\"w\":220,\"h\":140,\"tone\":\"main\",\"rx\":10},{\"k\":\"zip\",\"x\":90,\"y\":104,\"w\":220},{\"k\":\"panel\",\"x\":72,\"y\":98,\"w\":22,\"h\":20,\"tone\":\"tab\"},{\"k\":\"panel\",\"x\":306,\"y\":98,\"w\":22,\"h\":20,\"tone\":\"tab\"}]}},{\"label\":\"Open\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":90,\"y\":110,\"w\":220,\"h\":140,\"tone\":\"main\",\"rx\":10},{\"k\":\"poly\",\"pts\":[[100,112],[300,112],[270,150],[130,150]],\"tone\":\"lining\"},{\"k\":\"zip\",\"x\":90,\"y\":104,\"w\":220,\"open\":true}]}}],\"featured\":true,\"review\":{\"status\":\"published\",\"technicallyValidated\":false,\"updated\":\"2026-11-14\",\"reviewer\":\"SewCraft editorial (sample)\",\"note\":\"Sample pattern; not yet test-sewn.\"}},\"techniques\":[{\"id\":\"prewash\",\"name\":\"Pre-washing fabric\",\"summary\":\"Wash fabric the way you'll wash the finished item, before you cut.\"},{\"id\":\"pressing\",\"name\":\"Pressing\",\"summary\":\"Lift-and-lower ironing that sets seams and folds precisely.\"},{\"id\":\"straight-stitch\",\"name\":\"Straight stitch\",\"summary\":\"The everyday machine stitch for seams.\"},{\"id\":\"zigzag-stitch\",\"name\":\"Zigzag stitch\",\"summary\":\"Side-to-side stitch for neatening raw edges and sewing elastic.\"},{\"id\":\"backstitching\",\"name\":\"Backstitching\",\"summary\":\"Lock every seam so it can't unravel.\"},{\"id\":\"seam-allowance\",\"name\":\"Seam allowances \u0026 right sides together\",\"summary\":\"Where to stitch, and which way the fabric faces.\"},{\"id\":\"edgestitching\",\"name\":\"Edgestitching\",\"summary\":\"Stitching 2–3 mm from a fold for crisp edges.\"},{\"id\":\"topstitching\",\"name\":\"Topstitching\",\"summary\":\"Visible stitching that strengthens and decorates.\"},{\"id\":\"boxed-corners\",\"name\":\"Boxed corners\",\"summary\":\"Give a flat bag a base and depth.\"},{\"id\":\"lining\",\"name\":\"Lining a bag\",\"summary\":\"A clean inside finish with no exposed seams.\"},{\"id\":\"attaching-straps\",\"name\":\"Attaching straps\",\"summary\":\"Position and secure handles so they last.\"},{\"id\":\"clipping-corners\",\"name\":\"Clipping corners \u0026 curves\",\"summary\":\"Reduce bulk so corners turn out sharp.\"},{\"id\":\"ladder-stitch\",\"name\":\"Turning gap \u0026 ladder stitch\",\"summary\":\"Close an opening invisibly by hand.\"},{\"id\":\"zipper\",\"name\":\"Installing a zipper (sandwich method)\",\"summary\":\"Outer + zipper + lining sewn in one pass.\"},{\"id\":\"casing\",\"name\":\"Making a casing\",\"summary\":\"A channel for elastic or a drawstring.\"},{\"id\":\"elastic-waistband\",\"name\":\"Elastic waistband\",\"summary\":\"Cut, thread and join elastic for a comfortable fit.\"},{\"id\":\"hemming\",\"name\":\"Double-fold hem\",\"summary\":\"Enclose the raw edge in two folds.\"},{\"id\":\"finishing-edges\",\"name\":\"Finishing raw edges\",\"summary\":\"Stop seams fraying inside unlined projects.\"},{\"id\":\"interfacing\",\"name\":\"Using fusible interfacing\",\"summary\":\"Add body to soft fabrics.\"},{\"id\":\"french-seam\",\"name\":\"French seams\",\"summary\":\"A seam that encloses its own raw edges — no fraying, no overlocker.\"},{\"id\":\"quilting\",\"name\":\"Quilting the layers\",\"summary\":\"Stitching through top, batting and backing so they act as one.\"},{\"id\":\"binding\",\"name\":\"Double-fold binding\",\"summary\":\"A folded strip that wraps and finishes a quilted edge.\"},{\"id\":\"gathering\",\"name\":\"Gathering\",\"summary\":\"Two rows of long stitches pulled to ruffle fabric evenly.\"},{\"id\":\"sewing-curves\",\"name\":\"Sewing curves\",\"summary\":\"Smooth curved seams without puckers.\"},{\"id\":\"staystitching\",\"name\":\"Staystitching\",\"summary\":\"A line of stitching that stops curved edges stretching.\"},{\"id\":\"eyelets\",\"name\":\"Installing eyelets\",\"summary\":\"Metal grommets for drawstrings and laces.\"},{\"id\":\"buttonholes\",\"name\":\"Buttonholes \u0026 buttons\",\"summary\":\"Machine buttonholes and sewing on a button with a shank.\"},{\"id\":\"adjustable-strap\",\"name\":\"Adjustable straps\",\"summary\":\"D-rings and a slider for a strap you can lengthen.\"}],\"glossary\":[{\"term\":\"right sides together\",\"aliases\":[\"RST\"],\"definition\":\"Place two pieces so their printed / 'good' faces touch. You sew on the wrong side, then turn the item so the seam is hidden.\",\"technique\":\"seam-allowance\"},{\"term\":\"wrong side\",\"definition\":\"The back face of the fabric — the side that ends up hidden inside the finished item.\"},{\"term\":\"right side\",\"definition\":\"The front, 'good' face of the fabric that shows on the finished item.\"},{\"term\":\"seam allowance\",\"definition\":\"The distance between the cut edge of the fabric and the stitching line.\",\"technique\":\"seam-allowance\"},{\"term\":\"backstitch\",\"aliases\":[\"backstitching\"],\"definition\":\"Sew 3–4 stitches in reverse and then forward again at the start and end of a seam to lock the threads.\",\"technique\":\"backstitching\"},{\"term\":\"press\",\"aliases\":[\"pressing\"],\"definition\":\"Lift and lower the iron onto the fabric rather than sliding it, so pieces don't stretch out of shape.\",\"technique\":\"pressing\"},{\"term\":\"edgestitch\",\"aliases\":[\"edgestitching\"],\"definition\":\"A line of stitching very close (2–3 mm) to a folded edge or seam.\",\"technique\":\"edgestitching\"},{\"term\":\"topstitch\",\"aliases\":[\"topstitching\"],\"definition\":\"A visible line of stitching on the right side, usually 5–7 mm from an edge, for strength and a crisp finish.\",\"technique\":\"topstitching\"},{\"term\":\"baste\",\"aliases\":[\"basting\"],\"definition\":\"Temporary long stitches that hold layers in place; they're hidden inside a later seam.\"},{\"term\":\"grainline\",\"aliases\":[\"grain\"],\"definition\":\"The direction of the threads that run parallel to the selvedge. Pieces cut on grain hang straight and don't twist.\"},{\"term\":\"selvedge\",\"definition\":\"The tightly woven finished edges running along both sides of the fabric length. They don't fray.\"},{\"term\":\"on the fold\",\"definition\":\"Place the edge of the pattern piece exactly on the folded edge of the fabric so it opens into one symmetrical piece.\"},{\"term\":\"clip the corners\",\"aliases\":[\"clip corners\"],\"definition\":\"Snip diagonally across the seam allowance at a corner (without cutting the stitches) so it turns out sharp.\",\"technique\":\"clipping-corners\"},{\"term\":\"casing\",\"definition\":\"A folded tunnel of fabric that holds elastic or a drawstring.\",\"technique\":\"casing\"},{\"term\":\"interfacing\",\"definition\":\"A stabilising layer fused or sewn to the wrong side of fabric to add body.\",\"technique\":\"interfacing\"},{\"term\":\"raw edge\",\"aliases\":[\"raw edges\"],\"definition\":\"A cut edge of fabric that isn't finished and can fray.\"},{\"term\":\"boxed corners\",\"aliases\":[\"box the corners\"],\"definition\":\"Corners sewn across so a flat bag gets depth and a flat bottom.\",\"technique\":\"boxed-corners\"},{\"term\":\"zipper foot\",\"definition\":\"A narrow presser foot that lets the needle sew right next to zipper teeth.\",\"technique\":\"zipper\"},{\"term\":\"ladder stitch\",\"definition\":\"An invisible hand stitch that closes an opening from the outside.\",\"technique\":\"ladder-stitch\"},{\"term\":\"turning gap\",\"definition\":\"A section of a seam left unsewn so you can turn the item right side out.\",\"technique\":\"ladder-stitch\"},{\"term\":\"zigzag\",\"definition\":\"A side-to-side machine stitch used to stop raw edges fraying or to sew stretchy elastic.\",\"technique\":\"zigzag-stitch\"},{\"term\":\"pivot\",\"definition\":\"Stop with the needle down in the fabric, lift the presser foot, turn the fabric, lower the foot and continue.\"}]}]}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#faf6ef\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[27201,[\"/sewcraft/_next/static/chunks/ff1a16fafef87110.js\",\"/sewcraft/_next/static/chunks/7d5fd19a460be294.js\"],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Sewing: Zippered Makeup Pouch · SewCraft\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Discover, prepare, measure, cut and sew — guided sewing projects with accurate patterns.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/sewcraft/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"3\",{\"rel\":\"icon\",\"href\":\"/sewcraft/favicon.ico?favicon.0b3bf435.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L11\",\"4\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
