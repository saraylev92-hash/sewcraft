first · nylon: press cool\",\"anchor\":\"middle\"}]}},\"alt\":\"Fabric being pressed flat before cutting.\"},{\"id\":\"b2\",\"stage\":\"cut\",\"title\":\"Cut the body and tabs\",\"text\":\"Fold the fabric lengthwise and cut two body pieces and two tabs as shown. On each body piece, mark both side edges at the distance shown below the top edge — the side seams stop there. Cut the two cords to length.\",\"beginner\":\"The marks show where the side seam stops so the cords can come out of the casing.\",\"expert\":\"Cut 2 body + 2 tabs; mark side stops; cut 2 cords.\",\"pieces\":[\"body\",\"tab\"],\"measurements\":[{\"label\":\"Side-seam stop below top edge\",\"value\":\"cas + turn + 1\",\"unit\":\"len\"},{\"label\":\"Each cord\",\"value\":\"2*W + 2*H + 20\",\"unit\":\"len\"}],\"visual\":{\"type\":\"layout\",\"materialId\":\"main\"},\"alt\":\"Cutting layout with two body rectangles and two small tabs.\"},{\"id\":\"b3\",\"stage\":\"sew\",\"title\":\"Neaten the raw edges\",\"text\":\"Zigzag or overlock both side edges and the bottom edge of each body piece, working on the single layer. Leave the top edge raw — it will be enclosed in the casing.\",\"beginner\":\"Because the bag isn't lined, the inside seams will show. Finishing them now stops fraying in the wash.\",\"expert\":\"Neaten sides + base of both bodies.\",\"pieces\":[\"body\"],\"measurements\":[{\"label\":\"Zigzag width\",\"value\":5,\"unit\":\"mm\"}],\"techniques\":[\"finishing-edges\",\"zigzag-stitch\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":100,\"y\":30,\"w\":200,\"h\":240,\"tone\":\"main\",\"side\":\"wrong\"},{\"k\":\"stitch\",\"pts\":[[104,40],[110,50],[104,60],[110,70],[104,80],[110,90],[104,100],[110,110],[104,120],[110,130],[104,140],[110,150],[104,160],[110,170],[104,180],[110,190],[104,200],[110,210],[104,220],[110,230],[104,240],[110,250],[104,262]]},{\"k\":\"stitch\",\"pts\":[[104,266],[114,260],[124,266],[134,260],[144,266],[154,260],[164,266],[174,260],[184,266],[194,260],[204,266],[214,260],[224,266],[234,260],[244,266],[254,260],[264,266],[274,260],[284,266],[296,260]]},{\"k\":\"label\",\"x\":200,\"y\":22,\"text\":\"top edge stays raw\",\"anchor\":\"middle\"}]}},\"alt\":\"Zigzag stitching along the left side and bottom raw edges of a body piece.\"},{\"id\":\"b4\",\"stage\":\"sew\",\"title\":\"Make the corner tabs\",\"text\":\"Press each tab in half lengthwise, open, fold the long edges to the centre and fold again, like a mini strap. Edgestitch along both long edges. Fold each strip in half into a loop.\",\"expert\":\"4-fold tabs, edgestitch, fold into loops.\",\"pieces\":[\"tab\"],\"techniques\":[\"edgestitching\",\"pressing\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":60,\"y\":90,\"w\":280,\"h\":24,\"tone\":\"tab\"},{\"k\":\"stitch\",\"pts\":[[60,94],[340,94]]},{\"k\":\"stitch\",\"pts\":[[60,110],[340,110]]},{\"k\":\"arrow\",\"from\":[200,130],\"to\":[200,170]},{\"k\":\"cord\",\"pts\":[[170,230],[175,190],[200,180],[225,190],[230,230]],\"color\":\"tab\"},{\"k\":\"label\",\"x\":200,\"y\":260,\"text\":\"fold into a loop\",\"anchor\":\"middle\"}]}},\"alt\":\"A narrow stitched strip, then the same strip folded into a loop.\"},{\"id\":\"b5\",\"stage\":\"sew\",\"title\":\"Baste the tabs to the front corners\",\"text\":\"On the right side of the front piece, place a looped tab at each bottom corner: raw ends level with the side edge, 2 cm above the bottom edge, loop pointing inwards. Baste them in place 5 mm from the edge.\",\"beginner\":\"When the bag is turned, the loops will stick out of the side seams just above the base — that's where the cords tie on.\",\"expert\":\"Baste tab loops to front side edges, 2 cm above base.\",\"pieces\":[\"tab\",\"body\"],\"measurements\":[{\"label\":\"Tab above bottom edge\",\"value\":2,\"unit\":\"len\"},{\"label\":\"Basting from edge\",\"value\":0.5,\"unit\":\"len\"}],\"techniques\":[\"attaching-straps\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":100,\"y\":30,\"w\":200,\"h\":240,\"tone\":\"main\"},{\"k\":\"cord\",\"pts\":[[100,236],[126,230],[130,244],[100,248]],\"color\":\"tab\"},{\"k\":\"cord\",\"pts\":[[300,236],[274,230],[270,244],[300,248]],\"color\":\"tab\"},{\"k\":\"dim\",\"from\":[318,248],\"to\":[318,270],\"value\":2,\"offset\":0},{\"k\":\"focus\",\"x\":112,\"y\":242,\"r\":22}]}},\"alt\":\"Tab loops basted to both bottom side edges of the front piece, pointing inwards.\"},{\"id\":\"b6\",\"stage\":\"sew\",\"title\":\"Sew the sides and bottom\",\"text\":\"Place the back on the front, right sides together, and pin. Starting at one side-seam stop mark, sew down the side, across the bottom and up the other side to the second mark, using a 1 cm seam. Backstitch firmly at both marks and over the tabs.\",\"expert\":\"RST; sew from mark to mark round the base at 1 cm; reinforce at tabs and stops.\",\"pieces\":[\"body\"],\"measurements\":[{\"label\":\"Seam allowance\",\"value\":\"sa\",\"unit\":\"len\"},{\"label\":\"Stop below top edge\",\"value\":\"cas + turn + 1\",\"unit\":\"len\"}],\"techniques\":[\"seam-allowance\",\"backstitching\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":100,\"y\":30,\"w\":200,\"h\":240,\"tone\":\"main\",\"side\":\"wrong\"},{\"k\":\"stitch\",\"pts\":[[110,72],[110,260],[290,260],[290,72]]},{\"k\":\"gap\",\"from\":[86,30],\"to\":[86,72],\"label\":\"\"},{\"k\":\"gap\",\"from\":[314,30],\"to\":[314,72],\"label\":\"\"},{\"k\":\"dim\",\"from\":[330,30],\"to\":[330,72],\"value\":\"cas + turn + 1\",\"offset\":0},{\"k\":\"focus\",\"x\":110,\"y\":72,\"r\":14},{\"k\":\"focus\",\"x\":290,\"y\":72,\"r\":14}]}},\"alt\":\"Front and back sewn around the sides and bottom, the stitching stopping short of the top on both sides.\"},{\"id\":\"b7\",\"stage\":\"sew\",\"title\":\"Reinforce the side openings\",\"text\":\"Press the seams open, including the unsewn top section of each side. Topstitch a narrow U around each opening — down one side, across just below the stop mark, and back up — to hold the allowances flat and reinforce the stress point.\",\"beginner\":\"The cords pull on this point every time the bag is closed; the bar of stitching across the bottom of the opening stops the seam from tearing.\",\"expert\":\"Press open; topstitch U around each opening, bartack base.\",\"pieces\":[\"body\"],\"measurements\":[{\"label\":\"Topstitch from fold\",\"value\":0.5,\"unit\":\"len\"}],\"techniques\":[\"pressing\",\"topstitching\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":140,\"y\":30,\"w\":120,\"h\":230,\"tone\":\"main\",\"side\":\"wrong\"},{\"k\":\"fold\",\"from\":[200,30],\"to\":[200,260]},{\"k\":\"stitch\",\"pts\":[[192,30],[192,110],[208,110],[208,30]]},{\"k\":\"focus\",\"x\":200,\"y\":110,\"r\":20},{\"k\":\"label\",\"x\":200,\"y\":285,\"text\":\"seam pressed open · U-stitch round the opening\",\"anchor\":\"middle\"}]}},\"alt\":\"Close-up of a side seam pressed open with a U-shaped line of stitching around the unsewn opening.\"},{\"id\":\"b8\",\"stage\":\"sew\",\"title\":\"Form and stitch the casings\",\"text\":\"At the top edge, press 1 cm to the wrong side, then fold again by 3 cm so the fold sits level with the side opening, and press. Stitch close to the lower fold, separately on the front and on the back, leaving the side ends open.\",\"beginner\":\"You're making two separate tunnels — one across the front, one across the back. The cord enters and exits at the side openings.\",\"expert\":\"Casing: 1 cm + 3 cm, edgestitch lower fold front and back separately.\",\"pieces\":[\"body\"],\"measurements\":[{\"label\":\"First fold\",\"value\":\"turn\",\"unit\":\"len\"},{\"label\":\"Casing depth\",\"value\":\"cas\",\"unit\":\"len\"}],\"techniques\":[\"casing\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":80,\"y\":70,\"w\":240,\"h\":180,\"tone\":\"main\",\"side\":\"wrong\"},{\"k\":\"panel\",\"x\":80,\"y\":70,\"w\":240,\"h\":50,\"tone\":\"main\"},{\"k\":\"stitch\",\"pts\":[[80,116],[320,116]]},{\"k\":\"dim\",\"from\":[336,70],\"to\":[336,120],\"value\":\"cas\",\"offset\":0},{\"k\":\"cord\",\"pts\":[[40,92],[80,92],[320,92],[360,92]],\"color\":\"cord\"}]}},\"alt\":\"The top edge folded down into a casing with stitching along its lower edge and a cord passing through.\"},{\"id\":\"b9\",\"stage\":\"assemble\",\"title\":\"Turn right side out\",\"text\":\"Turn the bag right side out and push out the bottom corners. The tab loops should stick out of the side seams near the base.\",\"expert\":\"Turn RSO.\",\"pieces\":[\"body\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":100,\"y\":30,\"w\":200,\"h\":240,\"tone\":\"main\"},{\"k\":\"stitch\",\"pts\":[[100,70],[300,70]]},{\"k\":\"cord\",\"pts\":[[100,236],[82,240],[100,246]],\"color\":\"tab\"},{\"k\":\"cord\",\"pts\":[[300,236],[318,240],[300,246]],\"color\":\"tab\"},{\"k\":\"focus\",\"x\":92,\"y\":240,\"r\":16},{\"k\":\"focus\",\"x\":308,\"y\":240,\"r\":16}]}},\"alt\":\"The bag turned right side out with the tab loops showing at both bottom corners.\"},{\"id\":\"b10\",\"stage\":\"assemble\",\"title\":\"Thread the first cord\",\"text\":\"Attach a safety pin to one end of the first cord. Feed it into the LEFT opening, through the front casing, out of the right opening, back into the right opening through the back casing, and out of the LEFT opening again. Both ends are now on the left.\",\"beginner\":\"Pin the other end of the cord to the bag so it doesn't get pulled in. Scrunch the casing over the safety pin and slide the fabric off it.\",\"expert\":\"Cord 1: left → front → back → left.\",\"techniques\":[\"casing\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":100,\"y\":60,\"w\":200,\"h\":200,\"tone\":\"main\"},{\"k\":\"panel\",\"x\":100,\"y\":60,\"w\":200,\"h\":34,\"tone\":\"main\",\"side\":\"wrong\",\"dim\":true},{\"k\":\"cord\",\"pts\":[[100,76],[300,76],[316,70],[300,62],[100,62],[86,70],[70,140]],\"color\":\"cord\"},{\"k\":\"arrow\",\"from\":[150,110],\"to\":[260,110],\"label\":\"front\"},{\"k\":\"label\",\"x\":60,\"y\":165,\"text\":\"both ends left\",\"anchor\":\"middle\"}]}},\"alt\":\"A cord going in on the left, through the front casing, back through the rear casing and out on the left.\"},{\"id\":\"b11\",\"stage\":\"assemble\",\"title\":\"Thread the second cord\",\"text\":\"Repeat with the second cord in the opposite direction: into the RIGHT opening, through the back casing, out of the left, back through the front casing and out of the RIGHT opening.\",\"expert\":\"Cord 2: right → back → front → right.\",\"techniques\":[\"casing\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":100,\"y\":60,\"w\":200,\"h\":200,\"tone\":\"main\"},{\"k\":\"cord\",\"pts\":[[100,76],[300,76],[316,70],[300,62],[100,62],[86,70],[70,140]],\"color\":\"cord\"},{\"k\":\"cord\",\"pts\":[[300,82],[100,82],[84,76],[100,66],[300,66],[318,76],[330,140]],\"color\":\"#9C8F7A\"},{\"k\":\"label\",\"x\":340,\"y\":165,\"text\":\"both ends right\",\"anchor\":\"middle\"}]}},\"alt\":\"Two cords threaded in opposite directions, one pair of ends on each side.\"},{\"id\":\"b12\",\"stage\":\"finish\",\"title\":\"Tie the cords to the tabs\",\"text\":\"Take both ends of the left cord, thread them through the left tab loop and tie a firm double knot. Repeat on the right. Even out the cords so the straps are the same length. Seal synthetic cord ends with a brief flame, or knot them.\",\"expert\":\"Knot each cord pair through its tab; seal ends.\",\"warnings\":[\"If melting cord ends, do it away from the fabric, briefly, and never touch the hot melted end.\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":110,\"y\":60,\"w\":180,\"h\":210,\"tone\":\"main\"},{\"k\":\"cord\",\"pts\":[[110,70],[80,150],[96,240]],\"color\":\"cord\"},{\"k\":\"cord\",\"pts\":[[290,70],[320,150],[304,240]],\"color\":\"#9C8F7A\"},{\"k\":\"focus\",\"x\":100,\"y\":244,\"r\":18},{\"k\":\"focus\",\"x\":300,\"y\":244,\"r\":18},{\"k\":\"label\",\"x\":200,\"y\":290,\"text\":\"double knot through each tab\",\"anchor\":\"middle\"}]}},\"alt\":\"The cords running down each side and knotted through the tab loops at the bottom corners.\"}],\"gallery\":[{\"label\":\"Back view\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":110,\"y\":70,\"w\":180,\"h\":210,\"tone\":\"main\",\"rx\":4},{\"k\":\"stitch\",\"pts\":[[110,100],[290,100]]},{\"k\":\"cord\",\"pts\":[[112,80],[90,170],[104,262]],\"color\":\"cord\"},{\"k\":\"cord\",\"pts\":[[288,80],[310,170],[296,262]],\"color\":\"cord\"},{\"k\":\"cord\",\"pts\":[[112,80],[150,30],[250,30],[288,80]],\"color\":\"cord\"}]}}],\"review\":{\"status\":\"published\",\"technicallyValidated\":false,\"updated\":\"2026-11-14\",\"reviewer\":\"SewCraft editorial (sample)\",\"note\":\"Sample pattern; not yet test-sewn.\"}},\"techniques\":[{\"id\":\"prewash\",\"name\":\"Pre-washing fabric\",\"summary\":\"Wash fabric the way you'll wash the finished item, before you cut.\"},{\"id\":\"pressing\",\"name\":\"Pressing\",\"summary\":\"Lift-and-lower ironing that sets seams and folds precisely.\"},{\"id\":\"straight-stitch\",\"name\":\"Straight stitch\",\"summary\":\"The everyday machine stitch for seams.\"},{\"id\":\"zigzag-stitch\",\"name\":\"Zigzag stitch\",\"summary\":\"Side-to-side stitch for neatening raw edges and sewing elastic.\"},{\"id\":\"backstitching\",\"name\":\"Backstitching\",\"summary\":\"Lock every seam so it can't unravel.\"},{\"id\":\"seam-allowance\",\"name\":\"Seam allowances \u0026 right sides together\",\"summary\":\"Where to stitch, and which way the fabric faces.\"},{\"id\":\"edgestitching\",\"name\":\"Edgestitching\",\"summary\":\"Stitching 2–3 mm from a fold for crisp edges.\"},{\"id\":\"topstitching\",\"name\":\"Topstitching\",\"summary\":\"Visible stitching that strengthens and decorates.\"},{\"id\":\"boxed-corners\",\"name\":\"Boxed corners\",\"summary\":\"Give a flat bag a base and depth.\"},{\"id\":\"lining\",\"name\":\"Lining a bag\",\"summary\":\"A clean inside finish with no exposed seams.\"},{\"id\":\"attaching-straps\",\"name\":\"Attaching straps\",\"summary\":\"Position and secure handles so they last.\"},{\"id\":\"clipping-corners\",\"name\":\"Clipping corners \u0026 curves\",\"summary\":\"Reduce bulk so corners turn out sharp.\"},{\"id\":\"ladder-stitch\",\"name\":\"Turning gap \u0026 ladder stitch\",\"summary\":\"Close an opening invisibly by hand.\"},{\"id\":\"zipper\",\"name\":\"Installing a zipper (sandwich method)\",\"summary\":\"Outer + zipper + lining sewn in one pass.\"},{\"id\":\"casing\",\"name\":\"Making a casing\",\"summary\":\"A channel for elastic or a drawstring.\"},{\"id\":\"elastic-waistband\",\"name\":\"Elastic waistband\",\"summary\":\"Cut, thread and join elastic for a comfortable fit.\"},{\"id\":\"hemming\",\"name\":\"Double-fold hem\",\"summary\":\"Enclose the raw edge in two folds.\"},{\"id\":\"finishing-edges\",\"name\":\"Finishing raw edges\",\"summary\":\"Stop seams fraying inside unlined projects.\"},{\"id\":\"interfacing\",\"name\":\"Using fusible interfacing\",\"summary\":\"Add body to soft fabrics.\"},{\"id\":\"french-seam\",\"name\":\"French seams\",\"summary\":\"A seam that encloses its own raw edges — no fraying, no overlocker.\"},{\"id\":\"quilting\",\"name\":\"Quilting the layers\",\"summary\":\"Stitching through top, batting and backing so they act as one.\"},{\"id\":\"binding\",\"name\":\"Double-fold binding\",\"summary\":\"A folded strip that wraps and finishes a quilted edge.\"},{\"id\":\"gathering\",\"name\":\"Gathering\",\"summary\":\"Two rows of long stitches pulled to ruffle fabric evenly.\"},{\"id\":\"sewing-curves\",\"name\":\"Sewing curves\",\"summary\":\"Smooth curved seams without puckers.\"},{\"id\":\"staystitching\",\"name\":\"Staystitching\",\"summary\":\"A line of stitching that stops curved edges stretching.\"},{\"id\":\"eyelets\",\"name\":\"Installing eyelets\",\"summary\":\"Metal grommets for drawstrings and laces.\"},{\"id\":\"buttonholes\",\"name\":\"Buttonholes \u0026 buttons\",\"summary\":\"Machine buttonholes and sewing on a button with a shank.\"},{\"id\":\"adjustable-strap\",\"name\":\"Adjustable straps\",\"summary\":\"D-rings and a slider for a strap you can lengthen.\"}],\"glossary\":[{\"term\":\"right sides together\",\"aliases\":[\"RST\"],\"definition\":\"Place two pieces so their printed / 'good' faces touch. You sew on the wrong side, then turn the item so the seam is hidden.\",\"technique\":\"seam-allowance\"},{\"term\":\"wrong side\",\"definition\":\"The back face of the fabric — the side that ends up hidden inside the finished item.\"},{\"term\":\"right side\",\"definition\":\"The front, 'good' face of the fabric that shows on the finished item.\"},{\"term\":\"seam allowance\",\"definition\":\"The distance between the cut edge of the fabric and the stitching line.\",\"technique\":\"seam-allowance\"},{\"term\":\"backstitch\",\"aliases\":[\"backstitching\"],\"definition\":\"Sew 3–4 stitches in reverse and then forward again at the start and end of a seam to lock the threads.\",\"technique\":\"backstitching\"},{\"term\":\"press\",\"aliases\":[\"pressing\"],\"definition\":\"Lift and lower the iron onto the fabric rather than sliding it, so pieces don't stretch out of shape.\",\"technique\":\"pressing\"},{\"term\":\"edgestitch\",\"aliases\":[\"edgestitching\"],\"definition\":\"A line of stitching very close (2–3 mm) to a folded edge or seam.\",\"technique\":\"edgestitching\"},{\"term\":\"topstitch\",\"aliases\":[\"topstitching\"],\"definition\":\"A visible line of stitching on the right side, usually 5–7 mm from an edge, for strength and a crisp finish.\",\"technique\":\"topstitching\"},{\"term\":\"baste\",\"aliases\":[\"basting\"],\"definition\":\"Temporary long stitches that hold layers in place; they're hidden inside a later seam.\"},{\"term\":\"grainline\",\"aliases\":[\"grain\"],\"definition\":\"The direction of the threads that run parallel to the selvedge. Pieces cut on grain hang straight and don't twist.\"},{\"term\":\"selvedge\",\"definition\":\"The tightly woven finished edges running along both sides of the fabric length. They don't fray.\"},{\"term\":\"on the fold\",\"definition\":\"Place the edge of the pattern piece exactly on the folded edge of the fabric so it opens into one symmetrical piece.\"},{\"term\":\"clip the corners\",\"aliases\":[\"clip corners\"],\"definition\":\"Snip diagonally across the seam allowance at a corner (without cutting the stitches) so it turns out sharp.\",\"technique\":\"clipping-corners\"},{\"term\":\"casing\",\"definition\":\"A folded tunnel of fabric that holds elastic or a drawstring.\",\"technique\":\"casing\"},{\"term\":\"interfacing\",\"definition\":\"A stabilising layer fused or sewn to the wrong side of fabric to add body.\",\"technique\":\"interfacing\"},{\"term\":\"raw edge\",\"aliases\":[\"raw edges\"],\"definition\":\"A cut edge of fabric that isn't finished and can fray.\"},{\"term\":\"boxed corners\",\"aliases\":[\"box the corners\"],\"definition\":\"Corners sewn across so a flat bag gets depth and a flat bottom.\",\"technique\":\"boxed-corners\"},{\"term\":\"zipper foot\",\"definition\":\"A narrow presser foot that lets the needle sew right next to zipper teeth.\",\"technique\":\"zipper\"},{\"term\":\"ladder stitch\",\"definition\":\"An invisible hand stitch that closes an opening from the outside.\",\"technique\":\"ladder-stitch\"},{\"term\":\"turning gap\",\"definition\":\"A section of a seam left unsewn so you can turn the item right side out.\",\"technique\":\"ladder-stitch\"},{\"term\":\"zigzag\",\"definition\":\"A side-to-side machine stitch used to stop raw edges fraying or to sew stretchy elastic.\",\"technique\":\"zigzag-stitch\"},{\"term\":\"pivot\",\"definition\":\"Stop with the needle down in the fabric, lift the presser foot, turn the fabric, lower the foot and continue.\"}]}]}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"
