 → dry → press flat\",\"anchor\":\"middle\",\"bold\":true}]}},\"techniques\":[\"prewash\",\"pressing\"],\"expert\":\"Pre-wash and press both fabrics.\",\"alt\":\"Fabric laid flat and pressed with an iron. \"},{\"id\":\"kb2\",\"stage\":\"cut\",\"title\":\"Print the pattern piece\",\"text\":\"This bag has curves, so print the pattern piece at 100% scale (Print pattern), check the test square, and tape the pages together. One pattern piece is used four times.\",\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"path\",\"d\":\"M 132.0 82.0 L 168.0 82.0 C 168.0 130.0 180.0 154.0 200.0 154.0 C 220.0 154.0 232.0 130.0 232.0 98.0 L 232.0 26.0 L 268.0 26.0 L 268.0 254.0 Q 268.0 274.0 248.0 274.0 L 152.0 274.0 Q 132.0 274.0 132.0 254.0 Z\",\"tone\":\"#F5F1EA\",\"label\":\"pattern piece\",\"lx\":200,\"ly\":200},{\"k\":\"label\",\"x\":166,\"y\":74,\"text\":\"short\",\"anchor\":\"middle\",\"bold\":true},{\"k\":\"label\",\"x\":248,\"y\":18,\"text\":\"long\",\"anchor\":\"middle\",\"bold\":true},{\"k\":\"dim\",\"from\":[132,290],\"to\":[268,290],\"value\":34}]}},\"beginner\":\"Printing means the curves come out exactly as designed. The short and long handles must not be swapped — the label on the print shows which is which.\",\"techniques\":[\"seam-allowance\"],\"alt\":\"The knot bag pattern piece: a rounded body with a short handle on the left and a long handle on the right, 34 cm wide.\",\"expert\":\"This bag has curves, so print the pattern piece at 100% scale (Print pattern), check the test square, and tape the pages together.\"},{\"id\":\"kb3\",\"stage\":\"cut\",\"title\":\"Cut the outer\",\"text\":\"Fold the outer fabric right sides together and pin the pattern through both layers. Cutting through two layers gives you a mirrored pair — exactly what you need. Transfer the side notches.\",\"visual\":{\"type\":\"layout\",\"materialId\":\"main\"},\"pieces\":[\"outer\"],\"warnings\":[\"Cut slowly round the curves with the tips of sharp scissors, keeping your other hand cl "Sew the lining the same way\",\"text\":\"Repeat with the lining, but leave a 10 cm gap in the middle of the bottom seam for turning.\",\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"path\",\"d\":\"M 132.0 82.0 L 168.0 82.0 C 168.0 130.0 180.0 154.0 200.0 154.0 C 220.0 154.0 232.0 130.0 232.0 98.0 L 232.0 26.0 L 268.0 26.0 L 268.0 254.0 Q 268.0 274.0 248.0 274.0 L 152.0 274.0 Q 132.0 274.0 132.0 254.0 Z\",\"tone\":\"lining\",\"side\":\"wrong\",\"label\":\"lining\",\"lx\":200,\"ly\":210},{\"k\":\"stitch\",\"pts\":[[136,154],[136,254],[142,266],[176,266]]},{\"k\":\"stitch\",\"pts\":[[220,266],[254,266],[260,254],[260,154]]},{\"k\":\"gap\",\"from\":[176,284],\"to\":[220,284],\"label\":\"10 cm gap\"}]}},\"measurements\":[{\"label\":\"Turning gap\",\"value\":10,\"unit\":\"len\"}],\"pieces\":[\"liningp\"],\"techniques\":[\"ladder-stitch\"],\"alt\":\"The lining pieces stitched the same way with a 10 cm gap left in the bottom seam.\",\"expert\":\"Repeat with the lining, but leave a 10 cm gap in the middle of the bottom seam for turning.\"},{\"id\":\"kb7\",\"stage\":\"assemble\",\"title\":\"Nest outer inside lining\",\"text\":\"Turn the outer bag right side out. Push it inside the lining (lining still wrong side out) so the right sides face each other. Match the side seams and line up every handle and curve. Pin all along the top edges.\",\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":80,\"y\":40,\"w\":240,\"h\":210,\"tone\":\"main\"},{\"k\":\"panel\",\"x\":92,\"y\":52,\"w\":240,\"h\":210,\"tone\":\"lining\",\"side\":\"wrong\",\"dim\":true},{\"k\":\"pin\",\"x\":110,\"y\":70},{\"k\":\"pin\",\"x\":300,\"y\":70},{\"k\":\"pin\",\"x\":110,\"y\":240},{\"k\":\"pin\",\"x\":300,\"y\":240},{\"k\":\"label\",\"x\":200,\"y\":288,\"text\":\"outer inside lining — right sides together\",\"anchor\":\"middle\"}]}},\"pieces\":[\"outer\",\"liningp\"],\"techniques\":[\"lining\"],\"expert\":\"Turn the outer bag right side out.\",\"alt\":\"Two pieces layered: outer inside lining — right sides together.\"},{\"id\":\"kb8\",\"stage\":\"assemble\",\"title\":\"Sew round the curves and handles\",\"text\":\"Sew with a 1 cm seam along the inner scoop between the handles and along both long edges of every handle, stopping 3 cm before each handle end. Leave the four handle ends open — they are joined later. Backstitch at every stop.\",\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"path\",\"d\":\"M 132.0 82.0 L 168.0 82.0 C 168.0 130.0 180.0 154.0 200.0 154.0 C 220.0 154.0 232.0 130.0 232.0 98.0 L 232.0 26.0 L 268.0 26.0 L 268.0 254.0 Q 268.0 274.0 248.0 274.0 L 152.0 274.0 Q 132.0 274.0 132.0 254.0 Z\",\"tone\":\"lining\",\"side\":\"wrong\",\"lx\":200,\"ly\":210,\"label\":\"lining (outer inside)\"},{\"k\":\"stitch\",\"pts\":[[168,94],[168,130],[178,150],[200,154],[222,150],[232,130],[232,38]]},{\"k\":\"stitch\",\"pts\":[[136,94],[136,154]]},{\"k\":\"stitch\",\"pts\":[[264,38],[264,154]]},{\"k\":\"gap\",\"from\":[132,74],\"to\":[168,74],\"label\":\"end open\"},{\"k\":\"gap\",\"from\":[232,18],\"to\":[268,18],\"label\":\"end open\"}]}},\"expert\":\"Sew inner curve + both handle edges RST at 1 cm; stop 3 cm short of handle ends.\",\"beginner\":\"Think of it as sewing round the whole top edge of a bag, except the four little handle ends, which stay open so the handles can be joined later. Go slowly around the curve, stopping with the needle down to pivot slightly as you go.\",\"measurements\":[{\"label\":\"Seam allowance\",\"value\":\"sa\",\"unit\":\"len\"},{\"label\":\"Stop before handle ends\",\"value\":3,\"unit\":\"len\"}],\"pieces\":[\"outer\",\"liningp\"],\"techniques\":[\"sewing-curves\",\"backstitching\"],\"alt\":\"Stitching following the inner curve between the handles and both edges of each handle, with the handle ends left open.\"},{\"id\":\"kb9\",\"stage\":\"assemble\",\"title\":\"Clip the curves\",\"text\":\"Clip into the seam allowance every 1.5 cm around the inner curve, close to but not through the stitching, so it lies smooth when turned.\",\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":100,\"y\":60,\"w\":200,\"h\":180,\"tone\":\"lining\",\"side\":\"wrong\"},{\"k\":\"stitch\",\"pts\":[[100,80],[280,80],[280,240]]},{\"k\":\"fold\",\"from\":[266,60],\"to\":[300,94]},{\"k\":\"scissors\",\"x\":312,\"y\":52,\"angle\":135}]}},\"measurements\":[{\"label\":\"Clip spacing\",\"value\":1.5,\"unit\":\"len\"}],\"techniques\":[\"clipping-corners\",\"sewing-curves\"],\"expert\":\"Clip into the seam allowance every 1.5 cm around the inner curve, close to but not through the stitching, so it lies smooth when turned.\",\"alt\":\"A stitched corner with the seam allowance trimmed diagonally.\"},{\"id\":\"kb10\",\"stage\":\"assemble\",\"title\":\"Turn right side out\",\"text\":\"Pull the whole bag through the gap in the lining. Push the handles out fully with a point turner or chopstick and push the lining down inside the bag. Press the curved edges so the seam sits right on the edge.\",\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":80,\"y\":40,\"w\":240,\"h\":200,\"tone\":\"lining\",\"side\":\"wrong\"},{\"k\":\"gap\",\"from\":[165,240],\"to\":[235,240],\"label\":\"\"},{\"k\":\"arrow\",\"from\":[200,200],\"to\":[200,290]},{\"k\":\"focus\",\"x\":200,\"y\":240,\"r\":44},{\"k\":\"label\",\"x\":200,\"y\":26,\"text\":\"pull through the lining gap\",\"anchor\":\"middle\",\"bold\":true}]}},\"techniques\":[\"pressing\"],\"expert\":\"Pull the whole bag through the gap in the lining.\",\"alt\":\"The piece being pulled right side out through a gap in the seam.\"},{\"id\":\"kb11\",\"stage\":\"assemble\",\"title\":\"Join the handle ends\",\"text\":\"Take the two SHORT handle ends. Pull the lining layers out of the way and pin the two outer ends right sides together; sew across with 1 cm. Do the same for the two lining ends. Press open. Repeat with the two LONG handle ends. Tuck the remaining short gaps on each handle edge in line with the seams.\",\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":80,\"y\":90,\"w\":100,\"h\":70,\"tone\":\"main\",\"side\":\"wrong\",\"label\":\"outer ends RST\"},{\"k\":\"panel\",\"x\":220,\"y\":90,\"w\":100,\"h\":70,\"tone\":\"lining\",\"side\":\"wrong\",\"label\":\"lining ends RST\"},{\"k\":\"stitch\",\"pts\":[[80,102],[180,102]]},{\"k\":\"stitch\",\"pts\":[[220,102],[320,102]]},{\"k\":\"label\",\"x\":200,\"y\":210,\"text\":\"short to short · long to long\",\"anchor\":\"middle\",\"bold\":true}]}},\"beginner\":\"It's fiddly: the handle becomes a loop and the fabric twists a little. Keep the outer and lining layers separate while you sew each ring, and check nothing is twisted before sewing.\",\"measurements\":[{\"label\":\"Seam allowance\",\"value\":\"sa\",\"unit\":\"len\"}],\"pieces\":[\"outer\",\"liningp\"],\"techniques\":[\"seam-allowance\"],\"alt\":\"Outer handle ends sewn right sides together beside lining handle ends sewn right sides together.\",\"expert\":\"Take the two SHORT handle ends.\"},{\"id\":\"kb12\",\"stage\":\"finish\",\"title\":\"Close the openings\",\"text\":\"Slip-stitch (ladder-stitch) the short open sections on each handle edge, then close the lining gap by machine or by hand.\",\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":40,\"y\":110,\"w\":320,\"h\":40,\"tone\":\"main\"},{\"k\":\"panel\",\"x\":40,\"y\":152,\"w\":320,\"h\":40,\"tone\":\"main\"},{\"k\":\"stitch\",\"pts\":[[120,150],[120,152],[140,152],[140,150],[160,150],[160,152],[180,152],[180,150],[200,150],[200,152],[220,152],[220,150],[240,150],[240,152],[260,152]]},{\"k\":\"label\",\"x\":200,\"y\":240,\"text\":\"ladder stitch: cross straight over\",\"anchor\":\"middle\"}]}},\"pieces\":[\"liningp\"],\"techniques\":[\"ladder-stitch\"],\"expert\":\"Slip-stitch (ladder-stitch) the short open sections on each handle edge, then close the lining gap by machine or by hand.\",\"alt\":\"The folded edges of an opening closed with a hand ladder stitch.\"},{\"id\":\"kb13\",\"stage\":\"finish\",\"title\":\"Topstitch all edges\",\"text\":\"Topstitch 5 mm from every edge — round the inner curve and both edges of each handle — to keep the lining from rolling out.\",\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":80,\"y\":50,\"w\":240,\"h\":200,\"tone\":\"main\"},{\"k\":\"stitch\",\"pts\":[[80,62],[320,62]],\"closed\":false},{\"k\":\"foot\",\"x\":280,\"y\":62},{\"k\":\"dim\",\"from\":[66,50],\"to\":[66,62],\"value\":0.5}]}},\"measurements\":[{\"label\":\"Topstitch\",\"value\":0.5,\"unit\":\"len\"}],\"pieces\":[\"outer\"],\"techniques\":[\"topstitching\"],\"expert\":\"Topstitch 5 mm from every edge — round the inner curve and both edges of each handle — to keep the lining from rolling out.\",\"alt\":\"Stitching sewn a short distance in from the edges on the right side.\"},{\"id\":\"kb14\",\"stage\":\"finish\",\"title\":\"Tie the knot\",\"text\":\"Slip the long handle through the short loop and carry it on your wrist. To open, slide the long handle back out.\",\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"path\",\"d\":\"M 135.0 93.2 L 169.2 93.2 C 169.2 138.8 180.6 161.6 199.6 161.6 C 218.6 161.6 230.0 138.8 230.0 108.4 L 230.0 40.0 L 264.2 40.0 L 264.2 256.6 Q 264.2 275.6 245.2 275.6 L 154.0 275.6 Q 135.0 275.6 135.0 256.6 Z\",\"tone\":\"main\"},{\"k\":\"stitch\",\"pts\":[[168,100],[169,135],[180,158],[200,162],[220,158],[228,135],[229,46]]},{\"k\":\"cord\",\"pts\":[[248,44],[230,30],[175,70],[160,110]],\"color\":\"lining\"},{\"k\":\"label\",\"x\":200,\"y\":292,\"text\":\"Long handle through the short loop\",\"anchor\":\"middle\",\"bold\":true}]}},\"expert\":\"Slip the long handle through the short loop and carry it on your wrist.\",\"alt\":\"The finished Japanese Knot Bag.\"}],\"gallery\":[{\"label\":\"Knot bag\",\"scene\":{\"els\":[\"$5:props:children:props:project:steps:13:visual:scene:els:0\",\"$5:props:children:props:project:steps:13:visual:scene:els:1\",\"$5:props:children:props:project:steps:13:visual:scene:els:2\"]}}],\"review\":{\"status\":\"published\",\"technicallyValidated\":false,\"updated\":\"2026-11-14\",\"reviewer\":\"SewCraft editorial (sample)\",\"note\":\"Sample pattern; dimensions are internally consistent but not yet test-sewn.\"},\"customizable\":false,\"techniques\":[\"prewash\",\"pressing\",\"seam-allowance\",\"backstitching\",\"sewing-curves\",\"ladder-stitch\",\"lining\",\"clipping-corners\",\"topstitching\"]},\"techniques\":[{\"id\":\"prewash\",\"name\":\"Pre-washing fabric\",\"summary\":\"Wash fabric the way you'll wash the finished item, before you cut.\"},{\"id\":\"pressing\",\"name\":\"Pressing\",\"summary\":\"Lift-and-lower ironing that sets seams and folds precisely.\"},{\"id\":\"straight-stitch\",\"name\":\"Straight stitch\",\"summary\":\"The everyday machine stitch for seams.\"},{\"id\":\"zigzag-stitch\",\"name\":\"Zigzag stitch\",\"summary\":\"Side-to-side stitch for neatening raw edges and sewing elastic.\"},{\"id\":\"backstitching\",\"name\":\"Backstitching\",\"summary\":\"Lock every seam so it can't unravel.\"},{\"id\":\"seam-allowance\",\"name\":\"Seam allowances \u0026 right sides together\",\"summary\":\"Where to stitch, and which way the fabric faces.\"},{\"id\":\"edgestitching\",\"name\":\"Edgestitching\",\"summary\":\"Stitching 2–3 mm from a fold for crisp edges.\"},{\"id\":\"topstitching\",\"name\":\"Topstitching\",\"summary\":\"Visible stitching that strengthens and decorates.\"},{\"id\":\"boxed-corners\",\"name\":\"Boxed corners\",\"summary\":\"Give a flat bag a base and depth.\"},{\"id\":\"lining\",\"name\":\"Lining a bag\",\"summary\":\"A clean inside finish with no exposed seams.\"},{\"id\":\"attaching-straps\",\"name\":\"Attaching straps\",\"summary\":\"Position and secure handles so they last.\"},{\"id\":\"clipping-corners\",\"name\":\"Clipping corners \u0026 curves\",\"summary\":\"Reduce bulk so corners turn out sharp.\"},{\"id\":\"ladder-stitch\",\"name\":\"Turning gap \u0026 ladder stitch\",\"summary\":\"Close an opening invisibly by hand.\"},{\"id\":\"zipper\",\"name\":\"Installing a zipper (sandwich method)\",\"summary\":\"Outer + zipper + lining sewn in one pass.\"},{\"id\":\"casing\",\"name\":\"Making a casing\",\"summary\":\"A channel for elastic or a drawstring.\"},{\"id\":\"elastic-waistband\",\"name\":\"Elastic waistband\",\"summary\":\"Cut, thread and join elastic for a comfortable fit.\"},{\"id\":\"hemming\",\"name\":\"Double-fold hem\",\"summary\":\"Enclose the raw edge in two folds.\"},{\"id\":\"finishing-edges\",\"name\":\"Finishing raw edges\",\"summary\":\"Stop seams fraying inside unlined projects.\"},{\"id\":\"interfacing\",\"name\":\"Using fusible interfacing\",\"summary\":\"Add body to soft fabrics.\"},{\"id\":\"french-seam\",\"name\":\"French seams\",\"summary\":\"A seam that encloses its own raw edges — no fraying, no overlocker.\"},{\"id\":\"quilting\",\"name\":\"Quilting the layers\",\"summary\":\"Stitching through top, batting and backing so they act as one.\"},{\"id\":\"binding\",\"name\":\"Double-fold binding\",\"summary\":\"A folded strip that wraps and finishes a quilted edge.\"},{\"id\":\"gathering\",\"name\":\"Gathering\",\"summary\":\"Two rows of long stitches pulled to ruffle fabric evenly.\"},{\"id\":\"sewing-curves\",\"name\":\"Sewing curves\",\"summary\":\"Smooth curved seams without puckers.\"},{\"id\":\"staystitching\",\"name\":\"Staystitching\",\"summary\":\"A line of stitching that stops curved edges stretching.\"},{\"id\":\"eyelets\",\"name\":\"Installing eyelets\",\"summary\":\"Metal grommets for drawstrings and laces.\"},{\"id\":\"buttonholes\",\"name\":\"Buttonholes \u0026 buttons\",\"summary\":\"Machine buttonholes and sewing on a button with a shank.\"},{\"id\":\"adjustable-strap\",\"name\":\"Adjustable straps\",\"summary\":\"D-rings and a slider for a strap you can lengthen.\"}],\"glossary\":[{\"term\":\"right sides together\",\"aliases\":[\"RST\"],\"definition\":\"Place two pieces so their printed / 'good' faces touch. You sew on the wrong side, then turn the item so the seam is hidden.\",\"technique\":\"seam-allowance\"},{\"term\":\"wrong side\",\"definition\":\"The back face of the fabric — the side that ends up hidden inside the finished item.\"},{\"term\":\"right side\",\"definition\":\"The front, 'good' face of the fabric that shows on the finished item.\"},{\"term\":\"seam allowance\",\"definition\":\"The distance between the cut edge of the fabric and the stitching line.\",\"technique\":\"seam-allowance\"},{\"term\":\"backstitch\",\"aliases\":[\"backstitching\"],\"definition\":\"Sew 3–4 stitches in reverse and then forward again at the start and end of a seam to lock the threads.\",\"technique\":\"backstitching\"},{\"term\":\"press\",\"aliases\":[\"pressing\"],\"definition\":\"Lift and lower the iron onto the fabric rather than sliding it, so pieces don't stretch out of shape.\",\"technique\":\"pressing\"},{\"term\":\"edgestitch\",\"aliases\":[\"edgestitching\"],\"definition\":\"A line of stitching very close (2–3 mm) to a folded edge or seam.\",\"technique\":\"edgestitching\"},{\"term\":\"topstitch\",\"aliases\":[\"topstitching\"],\"definition\":\"A visible line of stitching on the right side, usually 5–7 mm from an edge, for strength and a crisp finish.\",\"technique\":\"topstitching\"},{\"term\":\"baste\",\"aliases\":[\"basting\"],\"definition\":\"Temporary long stitches that hold layers in place; they're hidden inside a later seam.\"},{\"term\":\"grainline\",\"aliases\":[\"grain\"],\"definition\":\"The direction of the threads that run parallel to the selvedge. Pieces cut on grain hang straight and don't twist.\"},{\"term\":\"selvedge\",\"definition\":\"The tightly woven finished edges running along both sides of the fabric length. They don't fray.\"},{\"term\":\"on the fold\",\"definition\":\"Place the edge of the pattern piece exactly on the folded edge of the fabric so it opens into one symmetrical piece.\"},{\"term\":\"clip the corners\",\"aliases\":[\"clip corners\"],\"definition\":\"Snip diagonally across the seam allowance at a corner (without cutting the stitches) so it turns out sharp.\",\"technique\":\"clipping-corners\"},{\"term\":\"casing\",\"definition\":\"A folded tunnel of fabric that holds elastic or a drawstring.\",\"technique\":\"casing\"},{\"term\":\"interfacing\",\"definition\":\"A stabilising layer fused or sewn to the wrong side of fabric to add body.\",\"technique\":\"interfacing\"},{\"term\":\"raw edge\",\"aliases\":[\"raw edges\"],\"definition\":\"A cut edge of fabric that isn't finished and can fray.\"},{\"term\":\"boxed corners\",\"aliases\":[\"box the corners\"],\"definition\":\"Corners sewn across so a flat bag gets depth and a flat bottom.\",\"technique\":\"boxed-corners\"},{\"term\":\"zipper foot\",\"definition\":\"A narrow presser foot that lets the needle sew right next to zipper teeth.\",\"technique\":\"zipper\"},{\"term\":\"ladder stitch\",\"definition\":\"An invisible hand stitch that closes an opening from the outside.\",\"technique\":\"ladder-stitch\"},{\"term\":\"turning gap\",\"definition\":\"A section of a seam left unsewn so you can turn the item right side out.\",\"technique\":\"ladder-stitch\"},{\"term\":\"zigzag\",\"definition\":\"A side-to-side machine stitch used to stop raw edges fraying or to sew stretchy elastic.\",\"technique\":\"zigzag-stitch\"},{\"term\":\"pivot\",\"definition\":\"Stop with the needle down in the fabric, lift the presser foot, turn the fabric, lower the foot and continue.\"}]}]}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#faf6ef\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[27201,[\"/sewcraft/_next/static/chunks/ff1a16fafef87110.js\",\"/sewcraft/_next/static/chunks/7d5fd19a460be294.js\"],\"IconMark\"]\n9:{\"metadata\":[[\"$\
