,\"name\":\"Double-fold binding\",\"summary\":\"A folded strip that wraps and finishes a quilted edge.\"},{\"id\":\"gathering\",\"name\":\"Gathering\",\"summary\":\"Two rows of long stitches pulled to ruffle fabric evenly.\"},{\"id\":\"sewing-curves\",\"name\":\"Sewing curves\",\"summary\":\"Smooth curved seams without puckers.\"},{\"id\":\"staystitching\",\"name\":\"Staystitching\",\"summary\":\"A line of stitching that stops curved edges stretching.\"},{\"id\":\"eyelets\",\"name\":\"Installing eyelets\",\"summary\":\"Metal grommets for drawstrings and laces.\"},{\"id\":\"buttonholes\",\"name\":\"Buttonholes \u0026 buttons\",\"summary\":\"Machine buttonholes and sewing on a button with a shank.\"},{\"id\":\"adjustable-strap\",\"name\":\"Adjustable straps\",\"summary\":\"D-rings and a slider for a strap you can lengthen.\"}],\"glossary\":[{\"term\":\"right sides together\",\"aliases\":[\"RST\"],\"definition\":\"Place two pieces so their printed / 'good' faces touch. You sew on the wrong side, then turn the item so the seam is hidden.\",\"technique\":\"seam-allowance\"},{\"term\":\"wrong side\",\"definition\":\"The back face of the fabric — the side that ends up hidden inside the finished item.\"},{\"term\":\"right side\",\"definition\":\"The front, 'good' face of the fabric that shows on the finished item.\"},{\"term\":\"seam allowance\",\"definition\":\"The distance between the cut edge of the fabric and the stitching line.\",\"technique\":\"seam-allowance\"},{\"term\":\"backstitch\",\"aliases\":[\"backstitching\"],\"definition\":\"Sew 3–4 stitches in reverse and then forward again at the start and end of a seam to lock the threads.\",\"technique\":\"backstitching\"},{\"term\":\"press\",\"aliases\":[\"pressing\"],\"definition\":\"Lift and lower the iron onto the fabric rather than sliding it, so pieces don't stretch out of shape.\",\"technique\":\"pressing\"},{\"term\":\"edgestitch\",\"aliases\":[\"edgestitching\"],\"definition\":\"A line of stitching very close (2–3 mm) to a folded edge or seam.\",\"technique\":\"edgestitching\"},{\"term\":\"topstitch\",\"aliases\":[\"topstitching\"],\"definition\":\"A visible line of stitching on the right side, usually 5–7 mm from an edge, for strength and a crisp finish.\",\"technique\":\"topstitching\"},{\"term\":\"baste\",\"aliases\":[\"basting\"],\"definition\":\"Temporary long stitches that hold layers in place; they're hidden inside a later seam.\"},{\"term\":\"grainline\",\"aliases\":[\"grain\"],\"definition\":\"The direction of the threads that run parallel to the selvedge. Pieces cut on grain hang straight and don't twist.\"},{\"term\":\"selvedge\",\"definition\":\"The tightly woven finished edges running along both sides of the fabric length. They don't fray.\"},{\"term\":\"on the fold\",\"definition\":\"Place the edge of the pattern piece exactly on the folded edge of the fabric so it opens into one symmetrical piece.\"},{\"term\":\"clip the corners\",\"aliases\":[\"clip corners\"],\"definition\":\"Snip diagonally across the seam allowance at a corner (without cutting the stitches) so it turns out sharp.\",\"technique\":\"clipping-corners\"},{\"term\":\"casing\",\"definition\":\"A folded tunnel of fabric that holds elastic or a drawstring.\",\"technique\":\"casing\"},{\"term\":\"interfacing\",\"definition\":\"A stabilising layer fused or sewn to the wrong side of fabric to add body.\",\"technique\":\"interfacing\"},{\"term\":\"raw edge\",\"aliases\":[\"raw edges\"],\"definition\":\"A cut edge of fabric that isn't finished and can fray.\"},{\"term\":\"boxed corners\",\"aliases\":[\"box the corners\"],\"definition\":\"Corners sewn across so a flat bag gets depth and a flat bottom.\",\"technique\":\"boxed-corners\"},{\"term\":\"zipper foot\",\"definition\":\"A narrow presser foot that lets the needle sew right next to zipper teeth.\",\"technique\":\"zipper\"},{\"term\":\"ladder stitch\",\"definition\":\"An invisible hand stitch that closes an opening from the outside.\",\"technique\":\"ladder-stitch\"},{\"term\":\"turning gap\",\"definition\":\"A section of a seam left unsewn so you can turn the item right side out.\",\"technique\":\"ladder-stitch\"},{\"term\":\"zigzag\",\"definition\":\"A side-to-side machine stitch used to stop raw edges fraying or to sew stretchy elastic.\",\"technique\":\"zigzag-stitch\"},{\"term\":\"pivot\",\"definition\":\"Stop with the needle down in the fabric, lift the presser foot, turn the fabric, lower the foot and continue.\"}]}]}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#faf6ef\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[27201,[\"/sewcraft/_next/static/chunks/ff1a16fafef87110.js\",\"/sewcraft/_next/static/chunks/7d5fd19a460be294.js\"],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Sewing: Envelope Cushion Cover · SewCraft\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Discover, prepare, measure, cut and sew — guided sewing projects with accurate patterns.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/sewcraft/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"3\",{\"rel\":\"icon\",\"href\":\"/sewcraft/favicon.ico?favicon.0b3bf435.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L11\",\"4\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
