 the seam for the elastic (backstitch either side).\",\"alt\":\"A piece of fabric folded along the dashed line and pressed: band loop pressed in half.\"},{\"id\":\"cs7\",\"stage\":\"assemble\",\"title\":\"Attach the waistband\",\"text\":\"Pin the band's raw edges to the skirt waist, right sides together, matching the band seam to a side seam. Sew with 1.5 cm, neaten and press up.\",\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":60,\"y\":60,\"w\":280,\"h\":190,\"tone\":\"main\"},{\"k\":\"panel\",\"x\":60,\"y\":48,\"w\":280,\"h\":22,\"tone\":\"band\"},{\"k\":\"stitch\",\"pts\":[[60,66],[340,66]]},{\"k\":\"foot\",\"x\":250,\"y\":66},{\"k\":\"label\",\"x\":200,\"y\":290,\"text\":\"sew to front, wrap to back, stitch\",\"anchor\":\"middle\"}]}},\"measurements\":[{\"label\":\"Seam allowance\",\"value\":\"sa\",\"unit\":\"len\"}],\"pieces\":[\"band\",\"quarter\"],\"expert\":\"Pin the band's raw edges to the skirt waist, right sides together, matching the band seam to a side seam.\",\"alt\":\"A folded binding strip sewn along the edge and wrapped to the back.\"},{\"id\":\"cs8\",\"stage\":\"assemble\",\"title\":\"Insert the elastic\",\"text\":\"Cut the elastic, thread it through the band via the gap, overlap the ends 2 cm and zigzag. Close the gap.\",\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"elastic\",\"x\":50,\"y\":140,\"w\":170},{\"k\":\"elastic\",\"x\":180,\"y\":140,\"w\":170},{\"k\":\"stitch\",\"pts\":[[180,140],[190,158],[200,140],[210,158],[220,140]]},{\"k\":\"dim\",\"from\":[180,190],\"to\":[220,190],\"value\":2}]}},\"measurements\":[{\"label\":\"Elastic length\",\"value\":\"waist*0.9 + 2\",\"unit\":\"len\"}],\"techniques\":[\"elastic-waistband\"],\"expert\":\"Cut the elastic, thread it through the band via the gap, overlap the ends 2 cm and zigzag.\",\"alt\":\"Two elastic ends overlapped and stitched with zigzag.\"},{\"id\":\"cs9\",\"stage\":\"finish\",\"title\":\"Hang overnight, then level the hem\",\"text\":\"Hang the skirt for 24 hours — the bias sections drop and lengthen. Put it on (or on a dress form) and have a helper mark an even hem with a ruler from the floor. Trim along the marks.\",\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"poly\",\"pts\":[[170,30],[230,30],[236,80],[222,110],[250,160],[244,210],[156,210],[150,160],[178,110],[164,80]],\"tone\":\"#E8DDCF\"},{\"k\":\"stitch\",\"pts\":[[150,162],[250,162]],\"color\":\"#C66B4E\"},{\"k\":\"label\",\"x\":262,\"y\":166,\"text\":\"hip\",\"bold\":true}]}},\"beginner\":\"Skipping this gives a wavy hem that's longer at the sides. It's the one step you can't rush.\",\"tips\":[\"Use a yardstick standing on the floor and pin at the same height all round.\"],\"expert\":\"Hang the skirt for 24 hours — the bias sections drop and lengthen.\",\"alt\":\"A body outline with measurement lines for hip.\"},{\"id\":\"cs10\",\"stage\":\"finish\",\"title\":\"Narrow hem\",\"text\":\"Press a narrow double hem — 0.5 cm, then 0.5 cm — easing the fullness, and stitch.\",\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":60,\"y\":50,\"w\":280,\"h\":190,\"tone\":\"main\",\"side\":\"wrong\"},{\"k\":\"panel\",\"x\":60,\"y\":190,\"w\":280,\"h\":50,\"tone\":\"main\"},{\"k\":\"fold\",\"from\":[60,240],\"to\":[340,240],\"label\":\"\"},{\"k\":\"dim\",\"from\":[354,190],\"to\":[354,240],\"value\":0.5},{\"k\":\"label\",\"x\":200,\"y\":285,\"text\":\"fold once, then again\",\"anchor\":\"middle\"},{\"k\":\"stitch\",\"pts\":[[60,194],[340,194]]},{\"k\":\"foot\",\"x\":260,\"y\":194}]}},\"measurements\":[{\"label\":\"Each fold\",\"value\":0.5,\"unit\":\"len\"}],\"pieces\":[\"quarter\"],\"techniques\":[\"hemming\",\"sewing-curves\"],\"expert\":\"Press a narrow double hem — 0.5 cm, then 0.5 cm — easing the fullness, and stitch.\",\"alt\":\"An edge folded twice to the wrong side and stitched near the inner fold.\"},{\"id\":\"cs11\",\"stage\":\"finish\",\"title\":\"Twirl\",\"text\":\"Press lightly and enjoy the swish.\",\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":160,\"y\":40,\"w\":80,\"h\":22,\"tone\":\"band\",\"rx\":4},{\"k\":\"path\",\"d\":\"M 160 62 L 240 62 Q 340 160 370 260 Q 200 290 30 260 Q 60 160 160 62 Z\",\"tone\":\"main\"},{\"k\":\"fold\",\"from\":[172.5,70],\"to\":[90,268]},{\"k\":\"fold\",\"from\":[190,70],\"to\":[160,268]},{\"k\":\"fold\",\"from\":[210,70],\"to\":[240,268]},{\"k\":\"fold\",\"from\":[227.5,70],\"to\":[310,268]},{\"k\":\"label\",\"x\":200,\"y\":292,\"text\":\"Finished!\",\"anchor\":\"middle\",\"bold\":true}]}},\"expert\":\"Press lightly and enjoy the swish.\",\"alt\":\"The finished Elastic-Waist Circle Skirt.\"}],\"gallery\":[{\"label\":\"Circle skirt\",\"scene\":{\"els\":[\"$5:props:children:props:project:steps:10:visual:scene:els:0\",\"$5:props:children:props:project:steps:10:visual:scene:els:1\",\"$5:props:children:props:project:steps:10:visual:scene:els:2\",\"$5:props:children:props:project:steps:10:visual:scene:els:3\",\"$5:props:children:props:project:steps:10:visual:scene:els:4\",\"$5:props:children:props:project:steps:10:visual:scene:els:5\"]}}],\"review\":{\"status\":\"published\",\"technicallyValidated\":false,\"updated\":\"2026-11-14\",\"reviewer\":\"SewCraft editorial (sample)\",\"note\":\"Sample pattern; dimensions are internally consistent but not yet test-sewn.\"},\"customizable\":true,\"techniques\":[\"prewash\",\"staystitching\",\"seam-allowance\",\"finishing-edges\",\"pressing\",\"elastic-waistband\",\"hemming\",\"sewing-curves\"]},\"techniques\":[{\"id\":\"prewash\",\"name\":\"Pre-washing fabric\",\"summary\":\"Wash fabric the way you'll wash the finished item, before you cut.\"},{\"id\":\"pressing\",\"name\":\"Pressing\",\"summary\":\"Lift-and-lower ironing that sets seams and folds precisely.\"},{\"id\":\"straight-stitch\",\"name\":\"Straight stitch\",\"summary\":\"The everyday machine stitch for seams.\"},{\"id\":\"zigzag-stitch\",\"name\":\"Zigzag stitch\",\"summary\":\"Side-to-side stitch for neatening raw edges and sewing elastic.\"},{\"id\":\"backstitching\",\"name\":\"Backstitching\",\"summary\":\"Lock every seam so it can't unravel.\"},{\"id\":\"seam-allowance\",\"name\":\"Seam allowances \u0026 right sides together\",\"summary\":\"Where to stitch, and which way the fabric faces.\"},{\"id\":\"edgestitching\",\"name\":\"Edgestitching\",\"summary\":\"Stitching 2–3 mm from a fold for crisp edges.\"},{\"id\":\"topstitching\",\"name\":\"Topstitching\",\"summary\":\"Visible stitching that strengthens and decorates.\"},{\"id\":\"boxed-corners\",\"name\":\"Boxed corners\",\"summary\":\"Give a flat bag a base and depth.\"},{\"id\":\"lining\",\"name\":\"Lining a bag\",\"summary\":\"A clean inside finish with no exposed seams.\"},{\"id\":\"attaching-straps\",\"name\":\"Attaching straps\",\"summary\":\"Position and secure handles so they last.\"},{\"id\":\"clipping-corners\",\"name\":\"Clipping corners \u0026 curves\",\"summary\":\"Reduce bulk so corners turn out sharp.\"},{\"id\":\"ladder-stitch\",\"name\":\"Turning gap \u0026 ladder stitch\",\"summary\":\"Close an opening invisibly by hand.\"},{\"id\":\"zipper\",\"name\":\"Installing a zipper (sandwich method)\",\"summary\":\"Outer + zipper + lining sewn in one pass.\"},{\"id\":\"casing\",\"name\":\"Making a casing\",\"summary\":\"A channel for elastic or a drawstring.\"},{\"id\":\"elastic-waistband\",\"name\":\"Elastic waistband\",\"summary\":\"Cut, thread and join elastic for a comfortable fit.\"},{\"id\":\"hemming\",\"name\":\"Double-fold hem\",\"summary\":\"Enclose the raw edge in two folds.\"},{\"id\":\"finishing-edges\",\"name\":\"Finishing raw edges\",\"summary\":\"Stop seams fraying inside unlined projects.\"},{\"id\":\"interfacing\",\"name\":\"Using fusible interfacing\",\"summary\":\"Add body to soft fabrics.\"},{\"id\":\"french-seam\",\"name\":\"French seams\",\"summary\":\"A seam that encloses its own raw edges — no fraying, no overlocker.\"},{\"id\":\"quilting\",\"name\":\"Quilting the layers\",\"summary\":\"Stitching through top, batting and backing so they act as one.\"},{\"id\":\"binding\",\"name\":\"Double-fold binding\",\"summary\":\"A folded strip that wraps and finishes a quilted edge.\"},{\"id\":\"gathering\",\"name\":\"Gathering\",\"summary\":\"Two rows of long stitches pulled to ruffle fabric evenly.\"},{\"id\":\"sewing-curves\",\"name\":\"Sewing curves\",\"summary\":\"Smooth curved seams without puckers.\"},{\"id\":\"staystitching\",\"name\":\"Staystitching\",\"summary\":\"A line of stitching that stops curved edges stretching.\"},{\"id\":\"eyelets\",\"name\":\"Installing eyelets\",\"summary\":\"Metal grommets for drawstrings and laces.\"},{\"id\":\"buttonholes\",\"name\":\"Buttonholes \u0026 buttons\",\"summary\":\"Machine buttonholes and sewing on a button with a shank.\"},{\"id\":\"adjustable-strap\",\"name\":\"Adjustable straps\",\"summary\":\"D-rings and a slider for a strap you can lengthen.\"}],\"glossary\":[{\"term\":\"right sides together\",\"aliases\":[\"RST\"],\"definition\":\"Place two pieces so their printed / 'good' faces touch. You sew on the wrong side, then turn the item so the seam is hidden.\",\"technique\":\"seam-allowance\"},{\"term\":\"wrong side\",\"definition\":\"The back face of the fabric — the side that ends up hidden inside the finished item.\"},{\"term\":\"right side\",\"definition\":\"The front, 'good' face of the fabric that shows on the finished item.\"},{\"term\":\"seam allowance\",\"definition\":\"The distance between the cut edge of the fabric and the stitching line.\",\"technique\":\"seam-allowance\"},{\"term\":\"backstitch\",\"aliases\":[\"backstitching\"],\"definition\":\"Sew 3–4 stitches in reverse and then forward again at the start and end of a seam to lock the threads.\",\"technique\":\"backstitching\"},{\"term\":\"press\",\"aliases\":[\"pressing\"],\"definition\":\"Lift and lower the iron onto the fabric rather than sliding it, so pieces don't stretch out of shape.\",\"technique\":\"pressing\"},{\"term\":\"edgestitch\",\"aliases\":[\"edgestitching\"],\"definition\":\"A line of stitching very close (2–3 mm) to a folded edge or seam.\",\"technique\":\"edgestitching\"},{\"term\":\"topstitch\",\"aliases\":[\"topstitching\"],\"definition\":\"A visible line of stitching on the right side, usually 5–7 mm from an edge, for strength and a crisp finish.\",\"technique\":\"topstitching\"},{\"term\":\"baste\",\"aliases\":[\"basting\"],\"definition\":\"Temporary long stitches that hold layers in place; they're hidden inside a later seam.\"},{\"term\":\"grainline\",\"aliases\":[\"grain\"],\"definition\":\"The direction of the threads that run parallel to the selvedge. Pieces cut on grain hang straight and don't twist.\"},{\"term\":\"selvedge\",\"definition\":\"The tightly woven finished edges running along both sides of the fabric length. They don't fray.\"},{\"term\":\"on the fold\",\"definition\":\"Place the edge of the pattern piece exactly on the folded edge of the fabric so it opens into one symmetrical piece.\"},{\"term\":\"clip the corners\",\"aliases\":[\"clip corners\"],\"definition\":\"Snip diagonally across the seam allowance at a corner (without cutting the stitches) so it turns out sharp.\",\"technique\":\"clipping-corners\"},{\"term\":\"casing\",\"definition\":\"A folded tunnel of fabric that holds elastic or a drawstring.\",\"technique\":\"casing\"},{\"term\":\"interfacing\",\"definition\":\"A stabilising layer fused or sewn to the wrong side of fabric to add body.\",\"technique\":\"interfacing\"},{\"term\":\"raw edge\",\"aliases\":[\"raw edges\"],\"definition\":\"A cut edge of fabric that isn't finished and can fray.\"},{\"term\":\"boxed corners\",\"aliases\":[\"box the corners\"],\"definition\":\"Corners sewn across so a flat bag gets depth and a flat bottom.\",\"technique\":\"boxed-corners\"},{\"term\":\"zipper foot\",\"definition\":\"A narrow presser foot that lets the needle sew right next to zipper teeth.\",\"technique\":\"zipper\"},{\"term\":\"ladder stitch\",\"definition\":\"An invisible hand stitch that closes an opening from the outside.\",\"technique\":\"ladder-stitch\"},{\"term\":\"turning gap\",\"definition\":\"A section of a seam left unsewn so you can turn the item right side out.\",\"technique\":\"ladder-stitch\"},{\"term\":\"zigzag\",\"definition\":\"A side-to-side machine stitch used to stop raw edges fraying or to sew stretchy elastic.\",\"technique\":\"zigzag-stitch\"},{\"term\":\"pivot\",\"definition\":\"Stop with the needle down in the fabric, lift the presser foot, turn the fabric, lower the foot and continue.\"}]}]}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#faf6ef\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[27201,[\"/sewcraft/_next/static/chunks/ff1a16fafef87110.js\",\"/sewcraft/_next/static/chunks/7d5fd19a460be294.js\"],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Sewing: Elastic-Waist Circle Skirt · SewCraft\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Discover, prepare, measure, cut and sew — guided sewing projects with accurate patterns.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/sewcraft/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"3\",{\"rel\":\"icon\",\"href\":\"/sewcraft/favicon.ico?favicon.0b3bf435.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L11\",\"4\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
