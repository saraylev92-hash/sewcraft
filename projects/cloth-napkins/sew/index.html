 fold — you'll use the creases as guides for the mitre.\",\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":60,\"y\":50,\"w\":280,\"h\":190,\"tone\":\"main\",\"side\":\"wrong\"},{\"k\":\"panel\",\"x\":60,\"y\":190,\"w\":280,\"h\":50,\"tone\":\"main\"},{\"k\":\"fold\",\"from\":[60,240],\"to\":[340,240],\"label\":\"\"},{\"k\":\"dim\",\"from\":[354,190],\"to\":[354,240],\"value\":1.5},{\"k\":\"label\",\"x\":200,\"y\":285,\"text\":\"fold once, then again\",\"anchor\":\"middle\"},{\"k\":\"iron\",\"x\":200,\"y\":110}]}},\"measurements\":[{\"label\":\"First fold\",\"value\":1,\"unit\":\"len\"},{\"label\":\"Second fold\",\"value\":1.5,\"unit\":\"len\"}],\"pieces\":[\"napkin\"],\"techniques\":[\"hemming\",\"pressing\"],\"warnings\":[\"Keep fingertips clear of the iron when pressing narrow folds.\"],\"expert\":\"On every edge, press 1 cm to the wrong side, then another 1.5 cm.\",\"alt\":\"An edge folded twice to the wrong side and stitched near the inner fold.\"},{\"id\":\"n4\",\"stage\":\"sew\",\"title\":\"Fold the mitred corners\",\"text\":\"At each corner, fold the tip diagonally towards the centre so the fold passes exactly through the point where the inner creases cross. Press, trim the tip 7 mm beyond the fold, then refold both hems — the edges meet in a neat 45° line.\",\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":60,\"y\":40,\"w\":260,\"h\":220,\"tone\":\"main\",\"side\":\"wrong\"},{\"k\":\"poly\",\"pts\":[[260,40],[320,40],[320,100],[260,100]],\"tone\":\"main\"},{\"k\":\"fold\",\"from\":[260,40],\"to\":[320,100],\"label\":\"\"},{\"k\":\"stitch\",\"pts\":[[60,104],[256,104],[256,260]]},{\"k\":\"focus\",\"x\":290,\"y\":70,\"r\":40},{\"k\":\"label\",\"x\":160,\"y\":285,\"text\":\"fold corner diagonally, then hem\",\"anchor\":\"middle\"}]}},\"beginner\":\"Take it slowly on the first corner. The diagonal fold should line up with the creases on both sides; if it doesn't, unfold and adjust before you trim.\",\"pieces\":[\ \"n7\",\"stage\":\"finish\",\"title\":\"Final press\",\"text\":\"Press all four napkins with steam. Fold them the same way and stack.\",\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":110,\"y\":70,\"w\":200,\"h\":180,\"tone\":\"main\"},{\"k\":\"panel\",\"x\":100,\"y\":80,\"w\":200,\"h\":180,\"tone\":\"main\"},{\"k\":\"panel\",\"x\":90,\"y\":90,\"w\":200,\"h\":180,\"tone\":\"main\"},{\"k\":\"stitch\",\"pts\":[[102,102],[278,102],[278,258],[102,258]],\"closed\":true},{\"k\":\"label\",\"x\":200,\"y\":292,\"text\":\"Set of four\",\"anchor\":\"middle\",\"bold\":true}]}},\"expert\":\"Press all four napkins with steam.\",\"alt\":\"The finished Mitred Cloth Napkins (set of 4).\"}],\"gallery\":[{\"label\":\"Stack\",\"scene\":{\"els\":[\"$5:props:children:props:project:steps:6:visual:scene:els:0\",\"$5:props:children:props:project:steps:6:visual:scene:els:1\",\"$5:props:children:props:project:steps:6:visual:scene:els:2\",\"$5:props:children:props:project:steps:6:visual:scene:els:3\"]}}],\"review\":{\"status\":\"published\",\"technicallyValidated\":false,\"updated\":\"2026-11-14\",\"reviewer\":\"SewCraft editorial (sample)\",\"note\":\"Sample pattern; dimensions are internally consistent but not yet test-sewn.\"},\"customizable\":true,\"techniques\":[\"prewash\",\"pressing\",\"hemming\",\"edgestitching\",\"ladder-stitch\"]},\"techniques\":[{\"id\":\"prewash\",\"name\":\"Pre-washing fabric\",\"summary\":\"Wash fabric the way you'll wash the finished item, before you cut.\"},{\"id\":\"pressing\",\"name\":\"Pressing\",\"summary\":\"Lift-and-lower ironing that sets seams and folds precisely.\"},{\"id\":\"straight-stitch\",\"name\":\"Straight stitch\",\"summary\":\"The everyday machine stitch for seams.\"},{\"id\":\"zigzag-stitch\",\"name\":\"Zigzag stitch\",\"summary\":\"Side-to-side stitch for neatening raw edges and sewing elastic.\"},{\"id\":\"backstitching\",\"name\":\"Backstitching\",\"summary\":\"Lock every seam so it can't unravel.\"},{\"id\":\"seam-allowance\",\"name\":\"Seam allowances \u0026 right sides together\",\"summary\":\"Where to stitch, and which way the fabric faces.\"},{\"id\":\"edgestitching\",\"name\":\"Edgestitching\",\"summary\":\"Stitching 2–3 mm from a fold for crisp edges.\"},{\"id\":\"topstitching\",\"name\":\"Topstitching\",\"summary\":\"Visible stitching that strengthens and decorates.\"},{\"id\":\"boxed-corners\",\"name\":\"Boxed corners\",\"summary\":\"Give a flat bag a base and depth.\"},{\"id\":\"lining\",\"name\":\"Lining a bag\",\"summary\":\"A clean inside finish with no exposed seams.\"},{\"id\":\"attaching-straps\",\"name\":\"Attaching straps\",\"summary\":\"Position and secure handles so they last.\"},{\"id\":\"clipping-corners\",\"name\":\"Clipping corners \u0026 curves\",\"summary\":\"Reduce bulk so corners turn out sharp.\"},{\"id\":\"ladder-stitch\",\"name\":\"Turning gap \u0026 ladder stitch\",\"summary\":\"Close an opening invisibly by hand.\"},{\"id\":\"zipper\",\"name\":\"Installing a zipper (sandwich method)\",\"summary\":\"Outer + zipper + lining sewn in one pass.\"},{\"id\":\"casing\",\"name\":\"Making a casing\",\"summary\":\"A channel for elastic or a drawstring.\"},{\"id\":\"elastic-waistband\",\"name\":\"Elastic waistband\",\"summary\":\"Cut, thread and join elastic for a comfortable fit.\"},{\"id\":\"hemming\",\"name\":\"Double-fold hem\",\"summary\":\"Enclose the raw edge in two folds.\"},{\"id\":\"finishing-edges\",\"name\":\"Finishing raw edges\",\"summary\":\"Stop seams fraying inside unlined projects.\"},{\"id\":\"interfacing\",\"name\":\"Using fusible interfacing\",\"summary\":\"Add body to soft fabrics.\"},{\"id\":\"french-seam\",\"name\":\"French seams\",\"summary\":\"A seam that encloses its own raw edges — no fraying, no overlocker.\"},{\"id\":\"quilting\",\"name\":\"Quilting the layers\",\"summary\":\"Stitching through top, batting and backing so they act as one.\"},{\"id\":\"binding\",\"name\":\"Double-fold binding\",\"summary\":\"A folded strip that wraps and finishes a quilted edge.\"},{\"id\":\"gathering\",\"name\":\"Gathering\",\"summary\":\"Two rows of long stitches pulled to ruffle fabric evenly.\"},{\"id\":\"sewing-curves\",\"name\":\"Sewing curves\",\"summary\":\"Smooth curved seams without puckers.\"},{\"id\":\"staystitching\",\"name\":\"Staystitching\",\"summary\":\"A line of stitching that stops curved edges stretching.\"},{\"id\":\"eyelets\",\"name\":\"Installing eyelets\",\"summary\":\"Metal grommets for drawstrings and laces.\"},{\"id\":\"buttonholes\",\"name\":\"Buttonholes \u0026 buttons\",\"summary\":\"Machine buttonholes and sewing on a button with a shank.\"},{\"id\":\"adjustable-strap\",\"name\":\"Adjustable straps\",\"summary\":\"D-rings and a slider for a strap you can lengthen.\"}],\"glossary\":[{\"term\":\"right sides together\",\"aliases\":[\"RST\"],\"definition\":\"Place two pieces so their printed / 'good' faces touch. You sew on the wrong side, then turn the item so the seam is hidden.\",\"technique\":\"seam-allowance\"},{\"term\":\"wrong side\",\"definition\":\"The back face of the fabric — the side that ends up hidden inside the finished item.\"},{\"term\":\"right side\",\"definition\":\"The front, 'good' face of the fabric that shows on the finished item.\"},{\"term\":\"seam allowance\",\"definition\":\"The distance between the cut edge of the fabric and the stitching line.\",\"technique\":\"seam-allowance\"},{\"term\":\"backstitch\",\"aliases\":[\"backstitching\"],\"definition\":\"Sew 3–4 stitches in reverse and then forward again at the start and end of a seam to lock the threads.\",\"technique\":\"backstitching\"},{\"term\":\"press\",\"aliases\":[\"pressing\"],\"definition\":\"Lift and lower the iron onto the fabric rather than sliding it, so pieces don't stretch out of shape.\",\"technique\":\"pressing\"},{\"term\":\"edgestitch\",\"aliases\":[\"edgestitching\"],\"definition\":\"A line of stitching very close (2–3 mm) to a folded edge or seam.\",\"technique\":\"edgestitching\"},{\"term\":\"topstitch\",\"aliases\":[\"topstitching\"],\"definition\":\"A visible line of stitching on the right side, usually 5–7 mm from an edge, for strength and a crisp finish.\",\"technique\":\"topstitching\"},{\"term\":\"baste\",\"aliases\":[\"basting\"],\"definition\":\"Temporary long stitches that hold layers in place; they're hidden inside a later seam.\"},{\"term\":\"grainline\",\"aliases\":[\"grain\"],\"definition\":\"The direction of the threads that run parallel to the selvedge. Pieces cut on grain hang straight and don't twist.\"},{\"term\":\"selvedge\",\"definition\":\"The tightly woven finished edges running along both sides of the fabric length. They don't fray.\"},{\"term\":\"on the fold\",\"definition\":\"Place the edge of the pattern piece exactly on the folded edge of the fabric so it opens into one symmetrical piece.\"},{\"term\":\"clip the corners\",\"aliases\":[\"clip corners\"],\"definition\":\"Snip diagonally across the seam allowance at a corner (without cutting the stitches) so it turns out sharp.\",\"technique\":\"clipping-corners\"},{\"term\":\"casing\",\"definition\":\"A folded tunnel of fabric that holds elastic or a drawstring.\",\"technique\":\"casing\"},{\"term\":\"interfacing\",\"definition\":\"A stabilising layer fused or sewn to the wrong side of fabric to add body.\",\"technique\":\"interfacing\"},{\"term\":\"raw edge\",\"aliases\":[\"raw edges\"],\"definition\":\"A cut edge of fabric that isn't finished and can fray.\"},{\"term\":\"boxed corners\",\"aliases\":[\"box the corners\"],\"definition\":\"Corners sewn across so a flat bag gets depth and a flat bottom.\",\"technique\":\"boxed-corners\"},{\"term\":\"zipper foot\",\"definition\":\"A narrow presser foot that lets the needle sew right next to zipper teeth.\",\"technique\":\"zipper\"},{\"term\":\"ladder stitch\",\"definition\":\"An invisible hand stitch that closes an opening from the outside.\",\"technique\":\"ladder-stitch\"},{\"term\":\"turning gap\",\"definition\":\"A section of a seam left unsewn so you can turn the item right side out.\",\"technique\":\"ladder-stitch\"},{\"term\":\"zigzag\",\"definition\":\"A side-to-side machine stitch used to stop raw edges fraying or to sew stretchy elastic.\",\"technique\":\"zigzag-stitch\"},{\"term\":\"pivot\",\"definition\":\"Stop with the needle down in the fabric, lift the presser foot, turn the fabric, lower the foot and continue.\"}]}]}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#faf6ef\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"11:I[27201,[\"/sewcraft/_next/static/chunks/ff1a16fafef87110.js\",\"/sewcraft/_next/static/chunks/7d5fd19a460be294.js\"],\"IconMark\"]\n9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Sewing: Mitred Cloth Napkins (set of 4) · SewCraft\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Discover, prepare, measure, cut and sew — guided sewing projects with accurate patterns.\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/sewcraft/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"3\",{\"rel\":\"icon\",\"href\":\"/sewcraft/favicon.ico?favicon.0b3bf435.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L11\",\"4\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
