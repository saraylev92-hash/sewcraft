ways half the depth; strap width and the pocket stay fixed. Nothing is scaled proportionally.\",\"related\":[\"drawstring-backpack\",\"zip-pouch\"],\"popularity\":98,\"costUSD\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:children:props:cards:0:costUSD\",\"tags\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:children:props:cards:0:tags\",\"finished\":{\"label\":\"Finished bag (approx.)\",\"dims\":[{\"label\":\"Width\",\"value\":\"W\"},{\"label\":\"Height\",\"value\":\"H\"},{\"label\":\"Depth (base)\",\"value\":\"D\"},{\"label\":\"Handle drop\",\"value\":\"handle/2 - 2\"}]},\"source\":\"editorial\",\"id\":\"classic-tote\",\"title\":\"Classic Lined Tote Bag\",\"summary\":\"A sturdy canvas tote with a boxed base, cotton lining and an inside pocket.\",\"description\":\"This is the perfect first 'real' project: straight seams, a clean lined finish, and techniques you'll use again and again — boxed corners, strap making and topstitching. The canvas outer stands up on its own, and the size is fully adjustable before you cut.\",\"category\":\"bags\",\"difficulty\":\"beginner\",\"minutes\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:children:props:cards:0:minutes\",\"machineRequired\":true,\"techniques\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:children:props:cards:0:techniques\",\"customizable\":true,\"tools\":[{\"id\":\"machine\",\"name\":\"Sewing machine\",\"required\":true,\"why\":\"All seams are machine-sewn for strength.\"},{\"id\":\"needle-90\",\"name\":\"Universal or denim needle 90/14\",\"required\":true,\"why\":\"Canvas is thick — finer needles bend or skip stitches.\",\"substitutes\":[\"Jeans needle 100/16\"]},{\"id\":\"scissors\",\"name\":\"Fabric scissors\",\"required\":true,\"why\":\"Clean cuts through two layers of canvas.\",\"substitutes\":[\"Rotary cutter + mat + ruler\"]},{\"id\":\"ruler\",\"name\":\"Quilting ruler or long straight ruler\",\"required\":true,\"why\":\"Marking accurate rectangles.\"},{\"id\":\"tape\",\"name\":\"Measuring tape\",\"required\":true,\"why\":\"Checking fabric and handle lengths.\"},{\"id\":\"marker\",\"name\":\"Fabric chalk or washable marker\",\"required\":true,\"why\":\"Marking pieces and corner squares.\"},{\"id\":\"clips\",\"name\":\"Pins or sewing clips\",\"required\":true,\"why\":\"Holding layers. Clips are easier on thick canvas.\",\"substitutes\":[\"Glass-head pins\"]},{\"id\":\"iron\",\"name\":\"Iron \u0026 ironing board\",\"required\":true,\"why\":\"Pressing folds and seams is half the work.\"},{\"id\":\"hand-needle\",\"name\":\"Hand-sewing needle\",\"required\":false,\"why\":\"Only if you close the lining gap by hand.\",\"substitutes\":[\"Close the gap by machine\"]},{\"id\":\"seam-ripper\",\"name\":\"Seam ripper\",\"required\":false,\"why\":\"For un-picking mistakes.\"},{\"id\":\"point-turner\",\"name\":\"Point turner\",\"required\":false,\"why\":\"Pushing out corners neatly.\",\"substitutes\":[\"Chopstick\",\"Knitting needle\"]}],\"materials\":[{\"id\":\"main\",\"name\":\"Main fabric — cotton canvas\",\"kind\":\"fabric\",\"required\":true,\"recommended\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:children:props:cards:0:materials:0:recommended\",\"minWidthCm\":112,\"weight\":\"Medium–heavy, 250–400 g/m² (8–12 oz/yd²)\",\"alternatives\":[\"Upcycled denim jeans (pieced)\",\"Quilting cotton + fusible fleece\"],\"why\":\"Forms the outside and the handles; needs body so the bag stands up.\",\"swatch\":\"#C26A4E\",\"layout\":{\"mode\":\"folded\",\"defaultWidth\":140,\"widths\":[112,140,150]}},{\"id\":\"lining\",\"name\":\"Lining — quilting cotton\",\"kind\":\"fabric\",\"required\":true,\"recommended\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:children:props:cards:0:materials:1:recommended\",\"minWidthCm\":112,\"weight\":\"Light–medium, 110–160 g/m²\",\"alternatives\":[\"An old cotton shirt or pillowcase\"],\"why\":\"Hides the seams and makes the bag tidy inside. Also used for the pocket.\",\"swatch\":\"#9DB09A\",\"layout\":{\"mode\":\"folded\",\"defaultWidth\":112,\"widths\":[112,140,150]}},{\"id\":\"thread\",\"name\":\"All-purpose polyester thread\",\"kind\":\"thread\",\"required\":true,\"quantity\":\"1 spool (≈ 200 m)\",\"why\":\"Polyester is stronger than cotton thread for bags.\",\"swatch\":\"#3A3530\",\"alternatives\":[\"Topstitching thread for the final topstitch\"]}],\"pieces\":[{\"id\":\"body\",\"name\":\"Outer body\",\"materialId\":\"main\",\"quantity\":2,\"width\":\"W + D + 2*sa\",\"height\":\"H + D/2 + 2*sa\",\"seamAllowance\":\"sa\",\"grain\":\"lengthwise\",\"markings\":[\"Cut a {D/2} square from both bottom corners\",\"Label: OUTER\"],\"color\":\"#C26A4E\"},{\"id\":\"handle\",\"name\":\"Handle\",\"materialId\":\"main\",\"quantity\":2,\"width\":\"4*hw\",\"height\":\"handle + 2*ins\",\"seamAllowance\":0,\"grain\":\"lengthwise\",\"notes\":\"Folded strap — no seam allowance on the long edges. Length includes {ins} at each end that is caught in the top seam.\",\"color\":\"#8E4A36\"},{\"id\":\"lining\",\"name\":\"Lining body\",\"materialId\":\"lining\",\"quantity\":2,\"width\":\"W + D + 2*sa\",\"height\":\"H + D/2 + 2*sa\",\"seamAllowance\":\"sa\",\"grain\":\"lengthwise\",\"markings\":[\"Cut a {D/2} square from both bottom corners\",\"Mark a 12 cm turning gap centred on the bottom edge of ONE piece\"],\"color\":\"#9DB09A\"},{\"id\":\"pocket\",\"name\":\"Pocket\",\"materialId\":\"lining\",\"quantity\":1,\"width\":\"pw + 2*sa\",\"height\":\"2*(ph + sa)\",\"seamAllowance\":\"sa\",\"grain\":\"lengthwise\",\"notes\":\"Folded in half at the top so the pocket opening is a clean fold.\",\"color\":\"#6F8C6C\"}],\"steps\":[{\"id\":\"t1\",\"stage\":\"prep\",\"title\":\"Pre-wash and press your fabric\",\"text\":\"Wash and dry both fabrics the way you'll wash the finished bag, then press out every crease. Canvas often shrinks 3–5% on its first wash.\",\"beginner\":\"If you skip this, the canvas may shrink later while the lining doesn't — the lining then bags out or the outer puckers. Press with steam on the cotton setting, lifting and lowering the iron.\",\"expert\":\"Pre-shrink both fabrics; press flat.\",\"techniques\":[\"prewash\",\"pressing\"],\"tips\":[\"Zig-zag the cut ends before washing so they don't unravel into a tangle.\"],\"warnings\":[\"Irons are hot: keep the cord clear and stand it upright when not in use.\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":30,\"y\":80,\"w\":170,\"h\":160,\"tone\":\"main\",\"label\":\"canvas\"},{\"k\":\"panel\",\"x\":220,\"y\":100,\"w\":150,\"h\":140,\"tone\":\"lining\",\"label\":\"lining\"},{\"k\":\"iron\",\"x\":290,\"y\":55},{\"k\":\"arrow\",\"from\":[250,96],\"to\":[330,96],\"bend\":10,\"label\":\"\"},{\"k\":\"label\",\"x\":290,\"y\":24,\"text\":\"lift \u0026 press — don't slide\",\"anchor\":\"middle\",\"bold\":true},{\"k\":\"label\",\"x\":200,\"y\":275,\"text\":\"Wash → dry → press flat\",\"anchor\":\"middle\",\"bold\":true}]}},\"alt\":\"The canvas and lining fabrics laid flat with an iron pressing them after washing.\"},{\"id\":\"t2\",\"stage\":\"prep\",\"title\":\"Set up your machine for canvas\",\"text\":\"Fit a 90/14 universal or denim needle and wind a bobbin. Set a straight stitch of 3 mm. Sew a test seam through two layers of canvas scrap and check that the stitches look the same on both sides.\",\"beginner\":\"If loops appear underneath, re-thread the top thread with the presser foot UP. If the top thread looks tight and pulls the bobbin thread up, lower the top tension by one number.\",\"expert\":\"90/14 needle, 3 mm straight stitch, test on two layers.\",\"measurements\":[{\"label\":\"Stitch length\",\"value\":3,\"unit\":\"mm\"},{\"label\":\"Seam allowance (all seams)\",\"value\":\"sa\",\"unit\":\"len\"}],\"techniques\":[\"straight-stitch\"],\"warnings\":[\"Keep fingers clear of the needle. Switch the machine off when changing needles or feet.\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":60,\"y\":110,\"w\":280,\"h\":120,\"tone\":\"main\",\"label\":\"2 layers of scrap\"},{\"k\":\"stitch\",\"pts\":[[60,140],[230,140]]},{\"k\":\"foot\",\"x\":240,\"y\":140},{\"k\":\"dim\",\"from\":[180,160],\"to\":[192,160],\"value\":3,\"unit\":\"mm\",\"offset\":18},{\"k\":\"label\",\"x\":200,\"y\":60,\"text\":\"Needle 90/14 · stitch 3 mm\",\"anchor\":\"middle\",\"bold\":true}]}},\"alt\":\"A test seam on two layers of canvas scrap under the presser foot, with stitch length 3 millimetres marked.\"},{\"id\":\"t3\",\"stage\":\"cut\",\"title\":\"Cut the outer body and handles\",\"text\":\"Fold the canvas lengthwise, right sides together, so the selvedges meet. Using the cutting layout, measure and mark the outer body rectangle and one handle strip, keeping the long sides parallel to the selvedge. Cut through both layers so you get two of each.\",\"beginner\":\"The grainline arrow on each piece must run parallel to the selvedge (the firm finished edge). Measure from the fold to each corner rather than eyeballing it, and double-check every measurement before cutting.\",\"expert\":\"Cut 2 body + 2 handles from folded canvas per layout.\",\"pieces\":[\"body\",\"handle\"],\"techniques\":[\"seam-allowance\"],\"tips\":[\"Mark with chalk on the wrong side.\",\"Check the rectangle is square: both diagonals should measure the same.\"],\"warnings\":[\"Cut away from your body; with a rotary cutter, close the blade every time you put it down.\"],\"visual\":{\"type\":\"layout\",\"materialId\":\"main\"},\"alt\":\"Cutting layout for the canvas showing two stacked layers with the body rectangle and handle strip placed along the grain.\"},{\"id\":\"t4\",\"stage\":\"cut\",\"title\":\"Cut the lining and pocket\",\"text\":\"Fold the lining fabric the same way and cut two lining body pieces. Then cut ONE pocket through a single layer. Mark a 12 cm turning gap centred on the bottom edge of one lining piece.\",\"beginner\":\"For the single pocket, fold the top layer of fabric back out of the way, or cut from an unfolded area, so you don't cut two.\",\"expert\":\"Cut 2 lining + 1 pocket; mark 12 cm gap on one lining base.\",\"pieces\":[\"lining\",\"pocket\"],\"measurements\":[{\"label\":\"Turning gap\",\"value\":12,\"unit\":\"len\"}],\"visual\":{\"type\":\"layout\",\"materialId\":\"lining\"},\"alt\":\"Cutting layout for the lining fabric with two lining bodies cut on the double and one pocket cut through a single layer.\"},{\"id\":\"t5\",\"stage\":\"cut\",\"title\":\"Cut the boxed-corner squares\",\"text\":\"On all four body pieces (2 outer, 2 lining), mark a square at both bottom corners measured from the raw edges, then cut the squares away. Label each piece with chalk (OUTER / LINING).\",\"beginner\":\"These squares are what give the bag its flat base. Their size is always half the base depth. Measure from the cut edges, not from where the seam will be.\",\"expert\":\"Remove D/2 squares from both bottom corners of all 4 body pieces.\",\"pieces\":[\"body\",\"lining\"],\"measurements\":[{\"label\":\"Corner square\",\"value\":\"D/2\",\"unit\":\"len\"}],\"techniques\":[\"boxed-corners\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":90,\"y\":30,\"w\":220,\"h\":230,\"tone\":\"main\",\"side\":\"wrong\",\"notch\":40,\"label\":\"OUTER ×2 · LINING ×2\"},{\"k\":\"cutout\",\"x\":90,\"y\":220,\"s\":40},{\"k\":\"cutout\",\"x\":270,\"y\":220,\"s\":40},{\"k\":\"dim\",\"from\":[90,278],\"to\":[130,278],\"value\":\"D/2\"},{\"k\":\"dim\",\"from\":[72,220],\"to\":[72,260],\"value\":\"D/2\"},{\"k\":\"scissors\",\"x\":330,\"y\":236,\"angle\":180}]}},\"alt\":\"A body panel with a small square removed from each bottom corner, each side of the square labelled half the base depth.\"},{\"id\":\"t6\",\"stage\":\"sew\",\"title\":\"Press the handles into four layers\",\"text\":\"Take one handle strip. Press it in half lengthwise, wrong sides together, and open it out. Fold both long raw edges in to meet the centre crease and press. Fold in half again along the original crease and press firmly. Repeat for the second handle.\",\"beginner\":\"You end up with a strip four layers thick with all raw edges hidden inside — no turning needed. Steam and a firm press make the next step much easier.\",\"expert\":\"Press handles to 4-fold, finished width shown.\",\"pieces\":[\"handle\"],\"measurements\":[{\"label\":\"Finished handle width\",\"value\":\"hw\",\"unit\":\"len\"}],\"techniques\":[\"pressing\"],\"warnings\":[\"Keep fingertips clear of the iron when pressing narrow folds — use a seam gauge or wooden tool to hold the fold.\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"label\",\"x\":20,\"y\":28,\"text\":\"1 · press in half, open\",\"bold\":true},{\"k\":\"panel\",\"x\":20,\"y\":38,\"w\":320,\"h\":56,\"tone\":\"main\",\"side\":\"wrong\"},{\"k\":\"fold\",\"from\":[20,66],\"to\":[340,66]},{\"k\":\"label\",\"x\":20,\"y\":122,\"text\":\"2 · fold edges to the centre crease\",\"bold\":true},{\"k\":\"panel\",\"x\":20,\"y\":132,\"w\":320,\"h\":28,\"tone\":\"main\",\"side\":\"wrong\"},{\"k\":\"arrow\",\"from\":[180,118],\"to\":[180,140]},{\"k\":\"arrow\",\"from\":[180,174],\"to\":[180,152]},{\"k\":\"label\",\"x\":20,\"y\":202,\"text\":\"3 · fold in half again\",\"bold\":true},{\"k\":\"panel\",\"x\":20,\"y\":212,\"w\":320,\"h\":18,\"tone\":\"main\"},{\"k\":\"dim\",\"from\":[348,212],\"to\":[348,230],\"value\":\"hw\",\"offset\":0}]}},\"alt\":\"Three stages of a handle strip: pressed in half, raw edges folded to the centre, then folded again into a narrow four-layer strap.\"},{\"id\":\"t7\",\"stage\":\"sew\",\"title\":\"Edgestitch both handles\",\"text\":\"Edgestitch along both long edges of each handle, 3 mm from the edge, starting with the open side. Sew slowly and keep the folds aligned.\",\"beginner\":\"Stitching the open edge first locks all four layers before they can shift. Stitching the folded edge as well makes the handles symmetrical and stronger.\",\"expert\":\"Edgestitch both long edges at 3 mm.\",\"pieces\":[\"handle\"],\"measurements\":[{\"label\":\"Edgestitch from edge\",\"value\":3,\"unit\":\"mm\"},{\"label\":\"Stitch length\",\"value\":3,\"unit\":\"mm\"}],\"techniques\":[\"edgestitching\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":20,\"y\":120,\"w\":320,\"h\":46,\"tone\":\"main\"},{\"k\":\"stitch\",\"pts\":[[20,125],[250,125]]},{\"k\":\"stitch\",\"pts\":[[20,161],[340,161]]},{\"k\":\"foot\",\"x\":262,\"y\":125},{\"k\":\"arrow\",\"from\":[150,100],\"to\":[60,100],\"label\":\"sewing direction\"},{\"k\":\"dim\",\"from\":[348,120],\"to\":[348,125],\"value\":3,\"unit\":\"mm\",\"offset\":0},{\"k\":\"label\",\"x\":200,\"y\":210,\"text\":\"open edge first, then folded edge\",\"anchor\":\"middle\"}]}},\"alt\":\"A handle strap with stitching 3 millimetres from both long edges, the presser foot sewing the top edge.\"},{\"id\":\"t8\",\"stage\":\"sew\",\"title\":\"Sew the pocket\",\"text\":\"Fold the pocket in half, right sides together, so the fold is at the top. Sew the two sides and the bottom with a 1 cm seam, leaving a 6 cm gap in the bottom. Backstitch at both sides of the gap. Clip the corners, turn right side out, push out the corners and press, tucking the gap's seam allowances inside.\",\"beginner\":\"The fold becomes the pocket's top edge, so it's clean without hemming. The gap gets closed automatically when you sew the pocket onto the lining.\",\"expert\":\"Fold RST, sew 3 sides at 1 cm with 6 cm gap, clip, turn, press.\",\"pieces\":[\"pocket\"],\"measurements\":[{\"label\":\"Seam allowance\",\"value\":\"sa\",\"unit\":\"len\"},{\"label\":\"Gap\",\"value\":6,\"unit\":\"len\"}],\"techniques\":[\"clipping-corners\",\"seam-allowance\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":110,\"y\":50,\"w\":180,\"h\":170,\"tone\":\"lining\",\"side\":\"wrong\"},{\"k\":\"fold\",\"from\":[110,50],\"to\":[290,50],\"label\":\"fold = pocket top\"},{\"k\":\"stitch\",\"pts\":[[122,50],[122,208],[170,208]]},{\"k\":\"stitch\",\"pts\":[[230,208],[278,208],[278,50]]},{\"k\":\"gap\",\"from\":[170,220],\"to\":[230,220],\"label\":\"6 cm gap\"},{\"k\":\"scissors\",\"x\":300,\"y\":232,\"angle\":135},{\"k\":\"dim\",\"from\":[110,240],\"to\":[122,240],\"value\":\"sa\",\"offset\":10}]}},\"alt\":\"The pocket folded in half with stitching down both sides and along the bottom, a gap left in the middle of the bottom seam.\"},{\"id\":\"t9\",\"stage\":\"sew\",\"title\":\"Attach the pocket to the lining\",\"text\":\"Place the lining piece WITHOUT the turning gap right side up. Centre the pocket on it with the pocket's folded edge 8 cm below the lining's top edge. Pin, then edgestitch down one side, across the bottom (closing the gap) and up the other side. Reinforce each top corner with a small triangle of stitching.\",\"beginner\":\"Measure from both side edges to make sure it's centred. The triangles at the top corners take the strain when you push things into the pocket.\",\"expert\":\"Centre pocket 8 cm below lining top; edgestitch 3 sides, bartack top corners.\",\"pieces\":[\"pocket\",\"lining\"],\"measurements\":[{\"label\":\"Pocket top below lining edge\",\"value\":8,\"unit\":\"len\"},{\"label\":\"Edgestitch\",\"value\":3,\"unit\":\"mm\"}],\"techniques\":[\"edgestitching\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":70,\"y\":20,\"w\":260,\"h\":250,\"tone\":\"lining\",\"notch\":32},{\"k\":\"panel\",\"x\":145,\"y\":70,\"w\":110,\"h\":96,\"tone\":\"pocket\",\"label\":\"pocket\"},{\"k\":\"stitch\",\"pts\":[[160,70],[148,70],[148,163],[252,163],[252,70],[240,70]]},{\"k\":\"stitch\",\"pts\":[[148,82],[160,70]]},{\"k\":\"stitch\",\"pts\":[[252,82],[240,70]]},{\"k\":\"dim\",\"from\":[290,20],\"to\":[290,70],\"value\":8,\"offset\":0},{\"k\":\"focus\",\"x\":252,\"y\":74,\"r\":18}]}},\"alt\":\"The pocket centred on a lining panel 8 centimetres below the top, stitched on three sides with small triangles at the top corners.\"},{\"id\":\"t10\",\"stage\":\"sew\",\"title\":\"Sew the outer bag\",\"text\":\"Place the two outer body pieces right sides together and clip. Sew down one side, across the bottom and up the other side with a 1 cm seam, backstitching at each end. Leave the cut-out corner squares unsewn. Press the seams open.\",\"beginner\":\"Your stitching should stop exactly where the cut-out begins on each corner — don't sew around the notch. Pressing seams open now makes the boxed corners line up neatly.\",\"expert\":\"Outer RST; sew sides + base at 1 cm, leave corners open; press open.\",\"pieces\":[\"body\"],\"measurements\":[{\"label\":\"Seam allowance\",\"value\":\"sa\",\"unit\":\"len\"}],\"techniques\":[\"seam-allowance\",\"backstitching\",\"pressing\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":90,\"y\":24,\"w\":220,\"h\":240,\"tone\":\"main\",\"side\":\"wrong\",\"notch\":36,\"label\":\"right sides together\"},{\"k\":\"stitch\",\"pts\":[[102,24],[102,228]]},{\"k\":\"stitch\",\"pts\":[[126,252],[274,252]]},{\"k\":\"stitch\",\"pts\":[[298,228],[298,24]]},{\"k\":\"clip\",\"x\":92,\"y\":90},{\"k\":\"clip\",\"x\":92,\"y\":170},{\"k\":\"clip\",\"x\":308,\"y\":90},{\"k\":\"clip\",\"x\":308,\"y\":170},{\"k\":\"focus\",\"x\":114,\"y\":240,\"r\":24},{\"k\":\"label\",\"x\":200,\"y\":290,\"text\":\"leave the corner cut-outs open\",\"anchor\":\"middle\"}]}},\"alt\":\"Two outer panels right sides together, stitched along both sides and the bottom, with the corner notches left unsewn.\"},{\"id\":\"t11\",\"stage\":\"sew\",\"title\":\"Box the outer corners\",\"text\":\"At one corner, pull the front and back apart and flatten the opening so the side seam sits directly on top of the bottom seam, forming a straight edge. Nest the pressed-open seams, clip, and sew straight across with a 1 cm seam. Backstitch twice — this seam takes the weight of the bag. Repeat on the other corner.\",\"beginner\":\"Feel through the fabric with your fingers that the two seams line up exactly. If they don't, the base will twist.\",\"expert\":\"Box corners: match seams, sew across at 1 cm, double backstitch.\",\"pieces\":[\"body\"],\"measurements\":[{\"label\":\"Boxing seam length = base depth\",\"value\":\"D\",\"unit\":\"len\"}],\"techniques\":[\"boxed-corners\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"poly\",\"pts\":[[200,30],[330,230],[70,230]],\"tone\":\"main\",\"side\":\"wrong\"},{\"k\":\"fold\",\"from\":[200,30],\"to\":[200,230],\"label\":\"side seam on bottom seam\"},{\"k\":\"stitch\",\"pts\":[[85,214],[315,214]]},{\"k\":\"dim\",\"from\":[85,260],\"to\":[315,260],\"value\":\"D\"},{\"k\":\"clip\",\"x\":140,\"y\":222},{\"k\":\"clip\",\"x\":260,\"y\":222}]}},\"alt\":\"A bag corner pinched into a triangle with the seams aligned and a straight seam sewn across, the length of which equals the base depth.\"},{\"id\":\"t12\",\"stage\":\"sew\",\"title\":\"Sew and box the lining\",\"text\":\"Repeat steps 10 and 11 with the two lining pieces, right sides together — but leave the 12 cm turning gap in the bottom seam open, backstitching on both sides of it. Box both lining corners.\",\"beginner\":\"The gap must be in a straight part of the bottom seam, not near a corner. Backstitch firmly on each side because you'll pull the whole bag through it.\",\"expert\":\"Lining as outer, leaving 12 cm gap in base.\",\"pieces\":[\"lining\"],\"measurements\":[{\"label\":\"Seam allowance\",\"value\":\"sa\",\"unit\":\"len\"},{\"label\":\"Turning gap\",\"value\":12,\"unit\":\"len\"}],\"techniques\":[\"boxed-corners\",\"ladder-stitch\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":90,\"y\":24,\"w\":220,\"h\":240,\"tone\":\"lining\",\"side\":\"wrong\",\"notch\":36,\"label\":\"lining, right sides together\"},{\"k\":\"stitch\",\"pts\":[[102,24],[102,228]]},{\"k\":\"stitch\",\"pts\":[[126,252],[165,252]]},{\"k\":\"stitch\",\"pts\":[[235,252],[274,252]]},{\"k\":\"stitch\",\"pts\":[[298,228],[298,24]]},{\"k\":\"gap\",\"from\":[165,272],\"to\":[235,272],\"label\":\"12 cm gap\"}]}},\"alt\":\"Lining panels sewn on the sides and bottom with a 12 centimetre gap left open in the middle of the bottom seam.\"},{\"id\":\"t13\",\"stage\":\"assemble\",\"title\":\"Baste the handles to the outer bag\",\"text\":\"Turn the outer bag right side out. On the front, place the ends of one handle with their raw ends level with the top edge and the loop hanging down over the bag. Position each end so its outer edge is the distance shown from the side seam. Check the handle isn't twisted, then baste 5 mm from the top edge. Repeat on the back, matching the position exactly.\",\"beginner\":\"Basting means a long, temporary stitch — it just holds the handle while you sew the real seam. The handles hang downwards now and flip up when the bag is turned.\",\"expert\":\"Baste handle ends at top edge, outer edges at W/4 from side seams; check no twist.\",\"pieces\":[\"handle\",\"body\"],\"measurements\":[{\"label\":\"Handle outer edge from side seam\",\"value\":\"W/4\",\"unit\":\"len\"},{\"label\":\"Basting from top edge\",\"value\":0.5,\"unit\":\"len\"},{\"label\":\"Basting stitch length\",\"value\":4,\"unit\":\"mm\"}],\"techniques\":[\"attaching-straps\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":60,\"y\":40,\"w\":280,\"h\":230,\"tone\":\"main\"},{\"k\":\"panel\",\"x\":130,\"y\":40,\"w\":22,\"h\":120,\"tone\":\"handle\",\"side\":\"wrong\"},{\"k\":\"panel\",\"x\":248,\"y\":40,\"w\":22,\"h\":120,\"tone\":\"handle\",\"side\":\"wrong\"},{\"k\":\"cord\",\"pts\":[[141,160],[160,220],[240,220],[259,160]],\"color\":\"handle\"},{\"k\":\"stitch\",\"pts\":[[110,45],[290,45]]},{\"k\":\"dim\",\"from\":[60,28],\"to\":[130,28],\"value\":\"W/4\"},{\"k\":\"dim\",\"from\":[270,28],\"to\":[340,28],\"value\":\"W/4\"},{\"k\":\"label\",\"x\":200,\"y\":290,\"text\":\"loop hangs down · not twisted\",\"anchor\":\"middle\"}]}},\"alt\":\"A handle with both ends basted at the top edge of the outer bag, loop hanging down, each end positioned a quarter of the bag width from the side.\"},{\"id\":\"t14\",\"stage\":\"assemble\",\"title\":\"Join outer and lining at the top\",\"text\":\"Leave the lining wrong side out. Slide the outer bag (right side out, handles hanging inside) into the lining so their right sides face. Match the side seams, nest them in opposite directions, and clip all around the top edge. Sew around the top with a 1 cm seam.\",\"beginner\":\"It looks strange: you'll see the wrong side of the lining on the outside and nothing of the canvas except the top edge. That's correct. Sew slowly over the handles — there are lots of layers there.\",\"expert\":\"Outer into lining RST, match side seams, sew top at 1 cm.\",\"pieces\":[\"body\",\"lining\",\"handle\"],\"measurements\":[{\"label\":\"Seam allowance\",\"value\":\"sa\",\"unit\":\"len\"}],\"techniques\":[\"lining\"],\"tips\":[\"Use a free-arm if your machine has one.\",\"Hand-walk the needle over the handle layers.\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":70,\"y\":40,\"w\":260,\"h\":230,\"tone\":\"lining\",\"side\":\"wrong\",\"label\":\"lining (wrong side out)\"},{\"k\":\"panel\",\"x\":80,\"y\":40,\"w\":240,\"h\":56,\"tone\":\"main\",\"dim\":true},{\"k\":\"stitch\",\"pts\":[[70,52],[330,52]]},{\"k\":\"clip\",\"x\":120,\"y\":44},{\"k\":\"clip\",\"x\":200,\"y\":44},{\"k\":\"clip\",\"x\":280,\"y\":44},{\"k\":\"arrow\",\"from\":[200,10],\"to\":[200,36],\"label\":\"outer goes inside\"},{\"k\":\"dim\",\"from\":[345,40],\"to\":[345,52],\"value\":\"sa\",\"offset\":0}]}},\"alt\":\"The outer bag nested inside the inside-out lining, clipped around the top edge with a seam one centimetre down.\"},{\"id\":\"t15\",\"stage\":\"assemble\",\"title\":\"Turn the bag right side out\",\"text\":\"Reach into the turning gap in the lining and gently pull the outer bag through it. Then push the lining down inside the outer bag. Use a point turner to push out the boxed corners.\",\"beginner\":\"Go slowly — pull from the base of the bag, not the handles. It will look crumpled; pressing fixes that.\",\"expert\":\"Turn through the gap; push lining inside.\",\"pieces\":[\"lining\"],\"techniques\":[\"lining\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":80,\"y\":40,\"w\":240,\"h\":200,\"tone\":\"lining\",\"side\":\"wrong\"},{\"k\":\"gap\",\"from\":[165,240],\"to\":[235,240],\"label\":\"turning gap\"},{\"k\":\"arrow\",\"from\":[200,200],\"to\":[200,290],\"label\":\"pull outer through\"},{\"k\":\"focus\",\"x\":200,\"y\":240,\"r\":46}]}},\"alt\":\"The bag being pulled right side out through the gap in the lining.\"},{\"id\":\"t16\",\"stage\":\"finish\",\"title\":\"Close the turning gap\",\"text\":\"Pull the lining out of the bag. Tuck the gap's seam allowances inside so the folds line up with the seam, and edgestitch the gap closed by machine, or ladder-stitch it by hand for an invisible finish. Push the lining back inside.\",\"beginner\":\"Machine-sewing it shut is perfectly fine — it ends up at the bottom of the bag where nobody sees it.\",\"expert\":\"Edgestitch or ladder-stitch gap closed.\",\"pieces\":[\"lining\"],\"measurements\":[{\"label\":\"Edgestitch\",\"value\":2,\"unit\":\"mm\"}],\"techniques\":[\"ladder-stitch\",\"edgestitching\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":40,\"y\":110,\"w\":320,\"h\":40,\"tone\":\"lining\"},{\"k\":\"panel\",\"x\":40,\"y\":152,\"w\":320,\"h\":40,\"tone\":\"lining\"},{\"k\":\"stitch\",\"pts\":[[130,148],[270,148]]},{\"k\":\"gap\",\"from\":[130,210],\"to\":[270,210],\"label\":\"folds tucked in \u0026 stitched\"},{\"k\":\"foot\",\"x\":280,\"y\":148}]}},\"alt\":\"Close-up of the tucked-in edges of the turning gap stitched shut close to the fold.\"},{\"id\":\"t17\",\"stage\":\"finish\",\"title\":\"Press and topstitch the top edge\",\"text\":\"Roll the seam at the top edge so it sits exactly on the edge, and press all the way around. Topstitch 5 mm from the top edge, through the outer, lining and handles, with a 3–3.5 mm stitch. Start and end at a side seam.\",\"beginner\":\"Topstitching keeps the lining from creeping out and adds strength where the handles are. Use the side of the presser foot as a guide.\",\"expert\":\"Press top edge; topstitch 5 mm, 3.5 mm stitch.\",\"pieces\":[\"body\",\"lining\"],\"measurements\":[{\"label\":\"Topstitch from edge\",\"value\":0.5,\"unit\":\"len\"},{\"label\":\"Stitch length\",\"value\":3.5,\"unit\":\"mm\"}],\"techniques\":[\"topstitching\",\"pressing\"],\"warnings\":[\"Steam is hot — keep your hand outside the bag when pressing the top edge.\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":60,\"y\":80,\"w\":280,\"h\":190,\"tone\":\"main\"},{\"k\":\"panel\",\"x\":130,\"y\":20,\"w\":22,\"h\":72,\"tone\":\"handle\"},{\"k\":\"panel\",\"x\":248,\"y\":20,\"w\":22,\"h\":72,\"tone\":\"handle\"},{\"k\":\"stitch\",\"pts\":[[60,90],[340,90]]},{\"k\":\"foot\",\"x\":310,\"y\":90},{\"k\":\"dim\",\"from\":[50,80],\"to\":[50,90],\"value\":0.5,\"offset\":0},{\"k\":\"iron\",\"x\":200,\"y\":190}]}},\"alt\":\"The top edge of the bag pressed and topstitched 5 millimetres from the edge, crossing the handles.\"},{\"id\":\"t18\",\"stage\":\"finish\",\"title\":\"Final press and check\",\"text\":\"Give the whole bag a final press. Check: both handles are the same length and not twisted, the boxed corners are symmetric, no lining shows at the top, and all thread ends are trimmed.\",\"beginner\":\"Pull firmly on each handle to test it before you load the bag up. If any stitch looks loose, sew over it again.\",\"expert\":\"Final press, QC handles and corners, trim threads.\",\"pieces\":[\"body\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":100,\"y\":110,\"w\":200,\"h\":170,\"tone\":\"main\"},{\"k\":\"stitch\",\"pts\":[[100,120],[300,120]]},{\"k\":\"cord\",\"pts\":[[140,112],[150,40],[200,22],[250,40],[260,112]],\"color\":\"handle\"},{\"k\":\"focus\",\"x\":140,\"y\":112,\"r\":16},{\"k\":\"focus\",\"x\":260,\"y\":112,\"r\":16},{\"k\":\"focus\",\"x\":110,\"y\":270,\"r\":16},{\"k\":\"focus\",\"x\":290,\"y\":270,\"r\":16},{\"k\":\"label\",\"x\":200,\"y\":205,\"text\":\"Handles · corners · top edge\",\"anchor\":\"middle\",\"bold\":true}]}},\"alt\":\"The finished tote bag with circles highlighting the handle joins and the base corners to check.\"}],\"gallery\":[\"$0:f:0:1:2:children:2:children:1:props:children:0:props:children:props:cards:0:gallery:0\",{\"label\":\"Side\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":168,\"y\":120,\"w\":64,\"h\":160,\"tone\":\"main\",\"rx\":3},{\"k\":\"stitch\",\"pts\":[[168,130],[232,130]]},{\"k\":\"cord\",\"pts\":[[196,122],[192,60],[200,24],[208,60],[204,122]],\"color\":\"handle\"},{\"k\":\"fold\",\"from\":[200,120],\"to\":[200,280]}]}},{\"label\":\"Inside\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":100,\"y\":90,\"w\":200,\"h\":190,\"tone\":\"lining\",\"rx\":3},{\"k\":\"panel\",\"x\":100,\"y\":90,\"w\":200,\"h\":16,\"tone\":\"main\"},{\"k\":\"panel\",\"x\":150,\"y\":140,\"w\":100,\"h\":86,\"tone\":\"pocket\"},{\"k\":\"stitch\",\"pts\":[[150,140],[150,226],[250,226],[250,140]]}]}}],\"featured\":true,\"review\":{\"status\":\"published\",\"technicallyValidated\":false,\"updated\":\"2026-11-14\",\"reviewer\":\"SewCraft editorial (sample)\",\"note\":\"Dimensions follow standard lined-tote construction and are internally consistent, but this sample has not yet been test-sewn.\"}},{\"constants\":{\"sa\":1},\"params\":[{\"id\":\"W\",\"label\":\"Finished width\",\"default\":22,\"min\":16,\"max\":30,\"step\":1},{\"id\":\"H\",\"label\":\"Finished height\",\"default\":14,\"min\":10,\"max\":20,\"step\":1},{\"id\":\"D\",\"label\":\"Base depth\",\"default\":6,\"min\":4,\"max\":10,\"step\":1}],\"sizes\":[{\"id\":\"standard\",\"label\":\"Makeup\",\"values\":{\"W\":22,\"H\":14,\"D\":6}},{\"id\":\"pencil\",\"label\":\"Pencil case\",\"values\":{\"W\":24,\"H\":10,\"D\":4}},{\"id\":\"wash\",\"label\":\"Wash bag\",\"values\":{\"W\":28,\"H\":18,\"D\":10}}],\"customNote\":\"Panels follow finished size + depth + seam allowances. The zipper must be at least 4 cm longer than the top edge; tabs stay the same size.\",\"related\":[\"classic-tote\",\"envelope-cushion\"],\"popularity\":84,\"costUSD\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:children:props:cards:1:costUSD\",\"tags\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:children:props:cards:1:tags\",\"finished\":{\"label\":\"Finished pouch (approx.)\",\"dims\":[{\"label\":\"Width\",\"value\":\"W\"},{\"label\":\"Height\",\"value\":\"H\"},{\"label\":\"Depth\",\"value\":\"D\"}]},\"source\":\"editorial\",\"id\":\"zip-pouch\",\"title\":\"Zippered Makeup Pouch\",\"summary\":\"A lined, boxed pouch with a neat zipper and tabbed ends.\",\"description\":\"Your first zipper, done the easy way. The sandwich method attaches outer, zipper and lining in one seam, and fabric tabs give clean ends. Boxed corners make it stand up on the counter. Great for makeup, pencils or chargers.\",\"category\":\"accessories\",\"difficulty\":\"intermediate\",\"minutes\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:children:props:cards:1:minutes\",\"machineRequired\":true,\"techniques\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:children:props:cards:1:techniques\",\"customizable\":true,\"tools\":[{\"id\":\"machine\",\"name\":\"Sewing machine\",\"required\":true,\"why\":\"All construction seams.\"},{\"id\":\"zip-foot\",\"name\":\"Zipper foot\",\"required\":true,\"why\":\"Lets you stitch next to the zipper teeth.\",\"substitutes\":[\"Adjustable needle position with standard foot (harder)\"]},{\"id\":\"scissors\",\"name\":\"Fabric scissors\",\"required\":true,\"why\":\"Cutting pieces.\"},{\"id\":\"ruler\",\"name\":\"Ruler\",\"required\":true,\"why\":\"Marking rectangles and corner squares.\"},{\"id\":\"marker\",\"name\":\"Fabric marker\",\"required\":true,\"why\":\"Marking.\"},{\"id\":\"clips\",\"name\":\"Sewing clips\",\"required\":true,\"why\":\"Holding layers around the zipper — pins distort it.\",\"substitutes\":[\"Pins\"]},{\"id\":\"iron\",\"name\":\"Iron \u0026 pressing cloth\",\"required\":true,\"why\":\"Fusing interfacing and pressing.\"},{\"id\":\"point-turner\",\"name\":\"Point turner\",\"required\":false,\"why\":\"Pushing out corners.\",\"substitutes\":[\"Chopstick\"]}],\"materials\":[{\"id\":\"main\",\"name\":\"Outer fabric\",\"kind\":\"fabric\",\"required\":true,\"recommended\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:children:props:cards:1:materials:0:recommended\",\"minWidthCm\":90,\"weight\":\"Light–medium\",\"alternatives\":[\"Scraps from the tote bag\"],\"why\":\"Forms the outside and zipper tabs.\",\"swatch\":\"#D9A35F\",\"layout\":{\"mode\":\"folded\",\"defaultWidth\":112,\"widths\":[90,112,140]}},{\"id\":\"lining\",\"name\":\"Lining fabric\",\"kind\":\"fabric\",\"required\":true,\"recommended\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:children:props:cards:1:materials:1:recommended\",\"minWidthCm\":90,\"weight\":\"Light\",\"why\":\"Clean inside finish.\",\"swatch\":\"#7E98A8\",\"layout\":{\"mode\":\"folded\",\"defaultWidth\":112,\"widths\":[90,112,140]}},{\"id\":\"interfacing\",\"name\":\"Medium fusible interfacing\",\"kind\":\"interfacing\",\"required\":false,\"recommended\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:children:props:cards:1:materials:2:recommended\",\"why\":\"Gives the pouch body so it stands up. Skip for canvas outers.\",\"swatch\":\"#ECE7DD\",\"alternatives\":[\"Fusible fleece\"],\"layout\":{\"mode\":\"single\",\"defaultWidth\":90,\"widths\":[50,90]}},{\"id\":\"zipper\",\"name\":\"Nylon coil zipper\",\"kind\":\"notion\",\"required\":true,\"quantity\":\"1 zipper, at least {W + D + 4} long\",\"why\":\"Coil zippers can be cut to length and sewn over.\",\"swatch\":\"#2E3A40\",\"alternatives\":[\"Zipper by the metre + 1 pull\"]},{\"id\":\"thread\",\"name\":\"All-purpose thread\",\"kind\":\"thread\",\"required\":true,\"quantity\":\"1 spool\",\"why\":\"Construction.\",\"swatch\":\"#3A3530\"}],\"pieces\":[{\"id\":\"outer\",\"name\":\"Outer panel\",\"materialId\":\"main\",\"quantity\":2,\"width\":\"W + D + 2*sa\",\"height\":\"H + D/2 + 2*sa\",\"seamAllowance\":\"sa\",\"grain\":\"lengthwise\",\"markings\":[\"Cut a {D/2} square from both bottom corners\"],\"color\":\"#D9A35F\"},{\"id\":\"tab\",\"name\":\"Zipper tab\",\"materialId\":\"main\",\"quantity\":2,\"width\":5,\"height\":8,\"seamAllowance\":0,\"grain\":\"any\",\"color\":\"#B8823F\"},{\"id\":\"lining\",\"name\":\"Lining panel\",\"materialId\":\"lining\",\"quantity\":2,\"width\":\"W + D + 2*sa\",\"height\":\"H + D/2 + 2*sa\",\"seamAllowance\":\"sa\",\"grain\":\"lengthwise\",\"markings\":[\"Cut a {D/2} square from both bottom corners\"],\"color\":\"#7E98A8\"},{\"id\":\"intf\",\"name\":\"Interfacing panel\",\"materialId\":\"interfacing\",\"quantity\":2,\"width\":\"W + D\",\"height\":\"H + D/2\",\"seamAllowance\":0,\"grain\":\"any\",\"notes\":\"Cut without seam allowance to reduce bulk; centre it on the outer panel.\",\"color\":\"#CFC8BA\"}],\"steps\":[{\"id\":\"p1\",\"stage\":\"prep\",\"title\":\"Press fabrics and check your zipper\",\"text\":\"Press both fabrics. Measure your zipper: the teeth (not the tape) must be at least as long as the measurement shown — it gets trimmed later, so longer is fine.\",\"beginner\":\"Coil zippers (with a plastic spiral) can be cut with ordinary scissors. Metal-tooth zippers can't be sewn over — don't use them for this project.\",\"expert\":\"Press; zipper ≥ shown length (coil).\",\"measurements\":[{\"label\":\"Minimum zipper length\",\"value\":\"W + D + 4\",\"unit\":\"len\"}],\"techniques\":[\"pressing\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"zip\",\"x\":50,\"y\":140,\"w\":300},{\"k\":\"dim\",\"from\":[50,180],\"to\":[350,180],\"value\":\"W + D + 4\"},{\"k\":\"label\",\"x\":200,\"y\":100,\"text\":\"coil zipper ≥ this length\",\"anchor\":\"middle\",\"bold\":true}]}},\"alt\":\"A coil zipper with its minimum length dimensioned.\"},{\"id\":\"p2\",\"stage\":\"cut\",\"title\":\"Cut the outer panels and tabs\",\"text\":\"Fold the outer fabric lengthwise and cut two outer panels and the two zipper tabs following the layout.\",\"expert\":\"Cut 2 outer + 2 tabs.\",\"pieces\":[\"outer\",\"tab\"],\"warnings\":[\"Keep blades closed and pointed away from you when not cutting.\"],\"visual\":{\"type\":\"layout\",\"materialId\":\"main\"},\"alt\":\"Cutting layout for the outer fabric with two panels and two small tabs.\"},{\"id\":\"p3\",\"stage\":\"cut\",\"title\":\"Cut the lining panels\",\"text\":\"Fold the lining and cut two lining panels the same size as the outer panels.\",\"expert\":\"Cut 2 lining.\",\"pieces\":[\"lining\"],\"visual\":{\"type\":\"layout\",\"materialId\":\"lining\"},\"alt\":\"Cutting layout for the lining fabric.\"},{\"id\":\"p4\",\"stage\":\"cut\",\"title\":\"Cut the interfacing\",\"text\":\"Cut two interfacing panels. They are smaller than the outer panels — this keeps the seams less bulky.\",\"beginner\":\"Interfacing has a glue side (slightly shiny or bumpy). It doesn't matter which way up you cut it.\",\"expert\":\"Cut 2 interfacing (no SA).\",\"pieces\":[\"intf\"],\"visual\":{\"type\":\"layout\",\"materialId\":\"interfacing\"},\"alt\":\"Cutting layout for the interfacing.\"},{\"id\":\"p5\",\"stage\":\"cut\",\"title\":\"Cut the corner squares\",\"text\":\"Cut a square from both bottom corners of every outer and lining panel, measured from the raw edges.\",\"expert\":\"Remove D/2 squares, outer + lining.\",\"pieces\":[\"outer\",\"lining\"],\"measurements\":[{\"label\":\"Corner square\",\"value\":\"D/2\",\"unit\":\"len\"}],\"techniques\":[\"boxed-corners\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":70,\"y\":60,\"w\":260,\"h\":170,\"tone\":\"main\",\"side\":\"wrong\",\"notch\":34},{\"k\":\"cutout\",\"x\":70,\"y\":196,\"s\":34},{\"k\":\"cutout\",\"x\":296,\"y\":196,\"s\":34},{\"k\":\"dim\",\"from\":[70,250],\"to\":[104,250],\"value\":\"D/2\"},{\"k\":\"label\",\"x\":200,\"y\":40,\"text\":\"outer ×2 · lining ×2\",\"anchor\":\"middle\",\"bold\":true}]}},\"alt\":\"A panel with squares cut from both bottom corners.\"},{\"id\":\"p6\",\"stage\":\"sew\",\"title\":\"Fuse the interfacing\",\"text\":\"Centre an interfacing panel, glue side down, on the wrong side of each outer panel, 1 cm in from every edge. Cover with a damp pressing cloth and press for 10–15 seconds in each spot without sliding. Let them cool flat.\",\"beginner\":\"Lift the iron and put it down in the next spot, overlapping slightly. Sliding causes wrinkles that can't be undone once cool.\",\"expert\":\"Fuse interfacing to outer WS, 1 cm inset.\",\"pieces\":[\"intf\",\"outer\"],\"measurements\":[{\"label\":\"Inset from edges\",\"value\":\"sa\",\"unit\":\"len\"}],\"techniques\":[\"interfacing\"],\"timerMin\":1,\"warnings\":[\"Hot iron and steam — use a pressing cloth and keep fingers clear.\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":70,\"y\":80,\"w\":260,\"h\":170,\"tone\":\"main\",\"side\":\"wrong\",\"notch\":34},{\"k\":\"panel\",\"x\":80,\"y\":90,\"w\":240,\"h\":150,\"tone\":\"intf\",\"notch\":24,\"label\":\"glue side down\"},{\"k\":\"iron\",\"x\":200,\"y\":48},{\"k\":\"dim\",\"from\":[70,270],\"to\":[80,270],\"value\":\"sa\",\"offset\":0}]}},\"alt\":\"Interfacing centred on the wrong side of an outer panel with a one-centimetre margin and an iron above.\"},{\"id\":\"p7\",\"stage\":\"sew\",\"title\":\"Add tabs to the zipper ends\",\"text\":\"Trim the zipper so that, with the tabs attached, it spans the length shown. Fold each tab in half, wrong sides together (short ends meeting), then open, fold each short end in to the centre crease and fold again so it wraps the zipper end. Edgestitch across each tab.\",\"beginner\":\"Before trimming, move the zipper pull to the middle so it doesn't fall off. Sew slowly over the coil; hand-turn the wheel if needed.\",\"expert\":\"Trim zip; wrap ends with folded tabs; total span = W + D.\",\"pieces\":[\"tab\"],\"measurements\":[{\"label\":\"Zipper + tabs total\",\"value\":\"W + D\",\"unit\":\"len\"}],\"techniques\":[\"edgestitching\"],\"warnings\":[\"Move the pull to the centre before cutting the zipper.\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"zip\",\"x\":80,\"y\":140,\"w\":240},{\"k\":\"panel\",\"x\":54,\"y\":126,\"w\":30,\"h\":36,\"tone\":\"tab\"},{\"k\":\"panel\",\"x\":316,\"y\":126,\"w\":30,\"h\":36,\"tone\":\"tab\"},{\"k\":\"stitch\",\"pts\":[[80,126],[80,162]]},{\"k\":\"stitch\",\"pts\":[[320,126],[320,162]]},{\"k\":\"dim\",\"from\":[54,200],\"to\":[346,200],\"value\":\"W + D\"}]}},\"alt\":\"A zipper with a folded fabric tab stitched over each end, the total length dimensioned.\"},{\"id\":\"p8\",\"stage\":\"sew\",\"title\":\"Sew the first side of the zipper\",\"text\":\"Lay one outer panel right side up. Place the zipper face down on it, tape edge level with the top edge, centred. Lay a lining panel right side down on top, matching the top edge. Clip. With the zipper foot, sew through all layers 1 cm from the edge. When you near the pull, stop with the needle down, lift the foot, slide the pull behind the foot, and continue.\",\"beginner\":\"Three layers: outer (face up), zipper (face down), lining (face down). The zipper is sandwiched with its teeth facing the outer.\",\"expert\":\"Outer RS up / zip face down / lining RS down; sew 1 cm with zipper foot.\",\"pieces\":[\"outer\",\"lining\"],\"measurements\":[{\"label\":\"Seam from top edge\",\"value\":\"sa\",\"unit\":\"len\"}],\"techniques\":[\"zipper\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":60,\"y\":120,\"w\":280,\"h\":140,\"tone\":\"main\"},{\"k\":\"zip\",\"x\":60,\"y\":112,\"w\":280},{\"k\":\"panel\",\"x\":60,\"y\":104,\"w\":280,\"h\":44,\"tone\":\"lining\",\"side\":\"wrong\",\"dim\":true,\"label\":\"lining face down\"},{\"k\":\"stitch\",\"pts\":[[60,126],[220,126]]},{\"k\":\"foot\",\"x\":232,\"y\":126},{\"k\":\"label\",\"x\":200,\"y\":290,\"text\":\"outer face up · zipper face down · lining face down\",\"anchor\":\"middle\"}]}},\"alt\":\"Outer panel, zipper and lining stacked along the top edge with stitching one centimetre down.\"},{\"id\":\"p9\",\"stage\":\"sew\",\"title\":\"Sew the second side\",\"text\":\"Fold the outer and lining away from the zipper. Repeat the sandwich on the other zipper tape with the second outer panel (right side up, under the zipper) and second lining panel (right side down on top). Line up the side edges with the first side, clip and sew.\",\"expert\":\"Repeat on the other tape, aligning sides.\",\"pieces\":[\"outer\",\"lining\"],\"measurements\":[{\"label\":\"Seam from top edge\",\"value\":\"sa\",\"unit\":\"len\"}],\"techniques\":[\"zipper\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":60,\"y\":30,\"w\":280,\"h\":100,\"tone\":\"main\"},{\"k\":\"zip\",\"x\":60,\"y\":136,\"w\":280},{\"k\":\"panel\",\"x\":60,\"y\":148,\"w\":280,\"h\":110,\"tone\":\"main\"},{\"k\":\"stitch\",\"pts\":[[60,154],[340,154]]},{\"k\":\"label\",\"x\":200,\"y\":285,\"text\":\"match side edges before sewing\",\"anchor\":\"middle\"}]}},\"alt\":\"Both outer panels attached to either side of the zipper, edges aligned.\"},{\"id\":\"p10\",\"stage\":\"sew\",\"title\":\"Press and topstitch along the zipper\",\"text\":\"Press the outer and lining away from the zipper on both sides so the fabric folds sit 3 mm from the teeth. Topstitch along each side, 3 mm from the fold, through outer and lining.\",\"beginner\":\"Topstitching stops the fabric from getting caught in the zipper pull.\",\"expert\":\"Press; topstitch 3 mm both sides.\",\"pieces\":[\"outer\",\"lining\"],\"measurements\":[{\"label\":\"Topstitch from fold\",\"value\":3,\"unit\":\"mm\"}],\"techniques\":[\"topstitching\",\"pressing\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":60,\"y\":40,\"w\":280,\"h\":100,\"tone\":\"main\"},{\"k\":\"zip\",\"x\":60,\"y\":140,\"w\":280},{\"k\":\"panel\",\"x\":60,\"y\":160,\"w\":280,\"h\":100,\"tone\":\"main\"},{\"k\":\"stitch\",\"pts\":[[60,134],[340,134]]},{\"k\":\"stitch\",\"pts\":[[60,166],[340,166]]},{\"k\":\"foot\",\"x\":240,\"y\":166}]}},\"alt\":\"Topstitching lines just beside both sides of the zipper.\"},{\"id\":\"p11\",\"stage\":\"assemble\",\"title\":\"Sew outer to outer, lining to lining\",\"text\":\"OPEN THE ZIPPER at least halfway. Bring the two outer panels right sides together and the two lining panels right sides together, with the zipper folded towards the lining (teeth facing the lining). Clip. Sew down the sides and across the bottoms with a 1 cm seam, leaving an 8 cm gap in the lining bottom and leaving all corner squares open.\",\"beginner\":\"If you forget to open the zipper, you can't turn the pouch. At the zipper, make sure the tabs point towards the lining and the zipper tapes lie flat.\",\"expert\":\"Open zip; outer RST + lining RST; sew all round except corners and 8 cm lining gap.\",\"pieces\":[\"outer\",\"lining\"],\"measurements\":[{\"label\":\"Seam allowance\",\"value\":\"sa\",\"unit\":\"len\"},{\"label\":\"Turning gap\",\"value\":8,\"unit\":\"len\"}],\"techniques\":[\"seam-allowance\",\"backstitching\"],\"warnings\":[\"Open the zipper first!\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":20,\"y\":80,\"w\":180,\"h\":130,\"tone\":\"main\",\"side\":\"wrong\",\"notch\":22,\"label\":\"outer RST\"},{\"k\":\"panel\",\"x\":200,\"y\":80,\"w\":180,\"h\":130,\"tone\":\"lining\",\"side\":\"wrong\",\"notch\":22,\"label\":\"lining RST\"},{\"k\":\"zip\",\"x\":194,\"y\":80,\"w\":12,\"open\":true},{\"k\":\"stitch\",\"pts\":[[30,80],[30,188]]},{\"k\":\"stitch\",\"pts\":[[42,200],[190,200]]},{\"k\":\"stitch\",\"pts\":[[370,80],[370,188]]},{\"k\":\"stitch\",\"pts\":[[210,200],[250,200]]},{\"k\":\"stitch\",\"pts\":[[310,200],[358,200]]},{\"k\":\"gap\",\"from\":[250,222],\"to\":[310,222],\"label\":\"8 cm gap\"},{\"k\":\"label\",\"x\":200,\"y\":50,\"text\":\"zipper OPEN\",\"anchor\":\"middle\",\"bold\":true}]}},\"alt\":\"Outer panels and lining panels each placed right sides together side by side, sewn around except a gap in the lining bottom.\"},{\"id\":\"p12\",\"stage\":\"assemble\",\"title\":\"Box all four corners\",\"text\":\"Box each of the four corners (two outer, two lining): match the side seam to the bottom seam, flatten, and sew across with a 1 cm seam. Backstitch.\",\"expert\":\"Box 4 corners at 1 cm.\",\"pieces\":[\"outer\",\"lining\"],\"measurements\":[{\"label\":\"Boxing seam = depth\",\"value\":\"D\",\"unit\":\"len\"}],\"techniques\":[\"boxed-corners\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"poly\",\"pts\":[[200,50],[320,220],[80,220]],\"tone\":\"main\",\"side\":\"wrong\"},{\"k\":\"fold\",\"from\":[200,50],\"to\":[200,220],\"label\":\"seams matched\"},{\"k\":\"stitch\",\"pts\":[[94,206],[306,206]]},{\"k\":\"dim\",\"from\":[94,250],\"to\":[306,250],\"value\":\"D\"}]}},\"alt\":\"A corner pinched with seams aligned and stitched across to box it.\"},{\"id\":\"p13\",\"stage\":\"finish\",\"title\":\"Turn, close the gap and shape\",\"text\":\"Turn the pouch right side out through the lining gap and through the open zipper. Push out the corners. Close the lining gap with edgestitching or a ladder stitch and push the lining inside.\",\"expert\":\"Turn, close gap, shape.\",\"pieces\":[\"lining\"],\"techniques\":[\"ladder-stitch\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":90,\"y\":60,\"w\":220,\"h\":150,\"tone\":\"lining\",\"side\":\"wrong\"},{\"k\":\"gap\",\"from\":[170,210],\"to\":[230,210],\"label\":\"pull pouch through\"},{\"k\":\"arrow\",\"from\":[200,180],\"to\":[200,275]}]}},\"alt\":\"The pouch being pulled through the lining gap.\"},{\"id\":\"p14\",\"stage\":\"finish\",\"title\":\"Final press\",\"text\":\"Press the pouch, using a rolled towel inside to shape it. Check the zipper runs smoothly end to end.\",\"expert\":\"Press over a towel roll; test zipper.\",\"pie ss just below the stop mark, and back up — to hold the allowances flat and reinforce the stress point.\",\"beginner\":\"The cords pull on this point every time the bag is closed; the bar of stitching across the bottom of the opening stops the seam from tearing.\",\"expert\":\"Press open; topstitch U around each opening, bartack base.\",\"pieces\":[\"body\"],\"measurements\":[{\"label\":\"Topstitch from fold\",\"value\":0.5,\"unit\":\"len\"}],\"techniques\":[\"pressing\",\"topstitching\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":140,\"y\":30,\"w\":120,\"h\":230,\"tone\":\"main\",\"side\":\"wrong\"},{\"k\":\"fold\",\"from\":[200,30],\"to\":[200,260]},{\"k\":\"stitch\",\"pts\":[[192,30],[192,110],[208,110],[208,30]]},{\"k\":\"focus\",\"x\":200,\"y\":110,\"r\":20},{\"k\":\"label\",\"x\":200,\"y\":285,\"text\":\"seam pressed open · U-stitch round the opening\",\"anchor\":\"middle\"}]}},\"alt\":\"Close-up of a side seam pressed open with a U-shaped line of stitching around the unsewn opening.\"},{\"id\":\"b8\",\"stage\":\"sew\",\"title\":\"Form and stitch the casings\",\"text\":\"At the top edge, press 1 cm to the wrong side, then fold again by 3 cm so the fold sits level with the side opening, and press. Stitch close to the lower fold, separately on the front and on the back, leaving the side ends open.\",\"beginner\":\"You're making two separate tunnels — one across the front, one across the back. The cord enters and exits at the side openings.\",\"expert\":\"Casing: 1 cm + 3 cm, edgestitch lower fold front and back separately.\",\"pieces\":[\"body\"],\"measurements\":[{\"label\":\"First fold\",\"value\":\"turn\",\"unit\":\"len\"},{\"label\":\"Casing depth\",\"value\":\"cas\",\"unit\":\"len\"}],\"techniques\":[\"casing\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":80,\"y\":70,\"w\":240,\"h\":180,\"tone\":\"main\",\"side\":\"wrong\"},{\"k\":\"panel\",\"x\":80,\"y\":70,\"w\":240,\"h\":50,\"tone\":\"main\"},{\"k\":\"stitch\",\"pts\":[[80,116],[320,116]]},{\"k\":\"dim\",\"from\":[336,70],\"to\":[336,120],\"value\":\"cas\",\"offset\":0},{\"k\":\"cord\",\"pts\":[[40,92],[80,92],[320,92],[360,92]],\"color\":\"cord\"}]}},\"alt\":\"The top edge folded down into a casing with stitching along its lower edge and a cord passing through.\"},{\"id\":\"b9\",\"stage\":\"assemble\",\"title\":\"Turn right side out\",\"text\":\"Turn the bag right side out and push out the bottom corners. The tab loops should stick out of the side seams near the base.\",\"expert\":\"Turn RSO.\",\"pieces\":[\"body\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":100,\"y\":30,\"w\":200,\"h\":240,\"tone\":\"main\"},{\"k\":\"stitch\",\"pts\":[[100,70],[300,70]]},{\"k\":\"cord\",\"pts\":[[100,236],[82,240],[100,246]],\"color\":\"tab\"},{\"k\":\"cord\",\"pts\":[[300,236],[318,240],[300,246]],\"color\":\"tab\"},{\"k\":\"focus\",\"x\":92,\"y\":240,\"r\":16},{\"k\":\"focus\",\"x\":308,\"y\":240,\"r\":16}]}},\"alt\":\"The bag turned right side out with the tab loops showing at both bottom corners.\"},{\"id\":\"b10\",\"stage\":\"assemble\",\"title\":\"Thread the first cord\",\"text\":\"Attach a safety pin to one end of the first cord. Feed it into the LEFT opening, through the front casing, out of the right opening, back into the right opening through the back casing, and out of the LEFT opening again. Both ends are now on the left.\",\"beginner\":\"Pin the other end of the cord to the bag so it doesn't get pulled in. Scrunch the casing over the safety pin and slide the fabric off it.\",\"expert\":\"Cord 1: left → front → back → left.\",\"techniques\":[\"casing\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":100,\"y\":60,\"w\":200,\"h\":200,\"tone\":\"main\"},{\"k\":\"panel\",\"x\":100,\"y\":60,\"w\":200,\"h\":34,\"tone\":\"main\",\"side\":\"wrong\",\"dim\":true},{\"k\":\"cord\",\"pts\":[[100,76],[300,76],[316,70],[300,62],[100,62],[86,70],[70,140]],\"color\":\"cord\"},{\"k\":\"arrow\",\"from\":[150,110],\"to\":[260,110],\"label\":\"front\"},{\"k\":\"label\",\"x\":60,\"y\":165,\"text\":\"both ends left\",\"anchor\":\"middle\"}]}},\"alt\":\"A cord going in on the left, through the front casing, back through the rear casing and out on the left.\"},{\"id\":\"b11\",\"stage\":\"assemble\",\"title\":\"Thread the second cord\",\"text\":\"Repeat with the second cord in the opposite direction: into the RIGHT opening, through the back casing, out of the left, back through the front casing and out of the RIGHT opening.\",\"expert\":\"Cord 2: right → back → front → right.\",\"techniques\":[\"casing\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":100,\"y\":60,\"w\":200,\"h\":200,\"tone\":\"main\"},{\"k\":\"cord\",\"pts\":[[100,76],[300,76],[316,70],[300,62],[100,62],[86,70],[70,140]],\"color\":\"cord\"},{\"k\":\"cord\",\"pts\":[[300,82],[100,82],[84,76],[100,66],[300,66],[318,76],[330,140]],\"color\":\"#9C8F7A\"},{\"k\":\"label\",\"x\":340,\"y\":165,\"text\":\"both ends right\",\"anchor\":\"middle\"}]}},\"alt\":\"Two cords threaded in opposite directions, one pair of ends on each side.\"},{\"id\":\"b12\",\"stage\":\"finish\",\"title\":\"Tie the cords to the tabs\",\"text\":\"Take both ends of the left cord, thread them through the left tab loop and tie a firm double knot. Repeat on the right. Even out the cords so the straps are the same length. Seal synthetic cord ends with a brief flame, or knot them.\",\"expert\":\"Knot each cord pair through its tab; seal ends.\",\"warnings\":[\"If melting cord ends, do it away from the fabric, briefly, and never touch the hot melted end.\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":110,\"y\":60,\"w\":180,\"h\":210,\"tone\":\"main\"},{\"k\":\"cord\",\"pts\":[[110,70],[80,150],[96,240]],\"color\":\"cord\"},{\"k\":\"cord\",\"pts\":[[290,70],[320,150],[304,240]],\"color\":\"#9C8F7A\"},{\"k\":\"focus\",\"x\":100,\"y\":244,\"r\":18},{\"k\":\"focus\",\"x\":300,\"y\":244,\"r\":18},{\"k\":\"label\",\"x\":200,\"y\":290,\"text\":\"double knot through each tab\",\"anchor\":\"middle\"}]}},\"alt\":\"The cords running down each side and knotted through the tab loops at the bottom corners.\"}],\"gallery\":[\"$0:f:0:1:2:children:2:children:1:props:children:0:props:children:props:cards:3:gallery:0\"],\"review\":{\"status\":\"published\",\"technicallyValidated\":false,\"updated\":\"2026-11-14\",\"reviewer\":\"SewCraft editorial (sample)\",\"note\":\"Sample pattern; not yet test-sewn.\"}},{\"constants\":{\"sa\":1.5,\"full\":1.5,\"ew\":3,\"hemA\":4},\"params\":[{\"id\":\"waist\",\"label\":\"Waist\",\"default\":72,\"min\":56,\"max\":112,\"step\":1,\"help\":\"Around your natural waist, tape snug but not tight.\"},{\"id\":\"hip\",\"label\":\"Hip\",\"default\":98,\"min\":82,\"max\":132,\"step\":1,\"help\":\"Around the fullest part of your hips.\"},{\"id\":\"L\",\"label\":\"Skirt length\",\"default\":60,\"min\":40,\"max\":90,\"step\":1,\"help\":\"From waist down to where you want the hem.\"}],\"sizes\":[{\"id\":\"xs\",\"label\":\"XS\",\"values\":{\"waist\":62,\"hip\":88,\"L\":58}},{\"id\":\"s\",\"label\":\"S\",\"values\":{\"waist\":66,\"hip\":92,\"L\":59}},{\"id\":\"m\",\"label\":\"M\",\"values\":{\"waist\":72,\"hip\":98,\"L\":60}},{\"id\":\"l\",\"label\":\"L\",\"values\":{\"waist\":80,\"hip\":106,\"L\":61}},{\"id\":\"xl\",\"label\":\"XL\",\"values\":{\"waist\":88,\"hip\":114,\"L\":62}}],\"customNote\":\"This pattern is drafted, not scaled: panel width comes from your hip × 1.5 fullness (minimum hip + 20 cm so it always pulls on), elastic from 90% of your waist plus a 2 cm overlap, and length from your chosen length plus fixed casing and hem allowances. Seam allowance stays 1.5 cm at every size. Size presets are typical body measurements — your own measurements are better.\",\"related\":[\"drawstring-backpack\",\"classic-tote\"],\"popularity\":79,\"costUSD\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:children:props:cards:4:costUSD\",\"tags\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:children:props:cards:4:tags\",\"finished\":{\"label\":\"Finished skirt\",\"dims\":[{\"label\":\"Length (waist to hem)\",\"value\":\"L\"},{\"label\":\"Hem circumference\",\"value\":\"max(hip*full, hip + 20)\"},{\"label\":\"Elastic (relaxed)\",\"value\":\"waist*0.9\"}]},\"source\":\"editorial\",\"id\":\"elastic-skirt\",\"title\":\"Simple Elastic-Waist Skirt\",\"summary\":\"A gathered, pull-on skirt drafted from your own waist, hip and length.\",\"description\":\"Two rectangles, an elastic casing and a hem — but drafted from your measurements so it actually fits. The panel width is based on your hip (so it always pulls on), the elastic on your waist, and the length is yours to choose.\",\"category\":\"clothing\",\"difficulty\":\"intermediate\",\"minutes\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:children:props:cards:4:minutes\",\"machineRequired\":true,\"techniques\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:children:props:cards:4:techniques\",\"customizable\":true,\"tools\":[{\"id\":\"machine\",\"name\":\"Sewing machine\",\"required\":true,\"why\":\"Seams, casing, hem.\"},{\"id\":\"tape\",\"name\":\"Soft measuring tape\",\"required\":true,\"why\":\"Taking body measurements.\"},{\"id\":\"scissors\",\"name\":\"Fabric scissors or rotary cutter\",\"required\":true,\"why\":\"Cutting long straight edges.\"},{\"id\":\"ruler\",\"name\":\"Long ruler\",\"required\":true,\"why\":\"Marking rectangles.\"},{\"id\":\"marker\",\"name\":\"Fabric chalk\",\"required\":true,\"why\":\"Marking.\"},{\"id\":\"pins\",\"name\":\"Pins\",\"required\":true,\"why\":\"Holding seams and hem.\"},{\"id\":\"iron\",\"name\":\"Iron\",\"required\":true,\"why\":\"Pressing casing and hem.\"},{\"id\":\"safety-pin\",\"name\":\"Safety pin or bodkin\",\"required\":true,\"why\":\"Threading elastic.\",\"substitutes\":[\"Bodkin\"]},{\"id\":\"seam-gauge\",\"name\":\"Seam gauge\",\"required\":false,\"why\":\"Even casing and hem.\",\"substitutes\":[\"Card strip\"]}],\"materials\":[{\"id\":\"main\",\"name\":\"Light woven fabric\",\"kind\":\"fabric\",\"required\":true,\"recommended\":\"$0:f:0:1:2:children:2:children:1:props:children:0:props:children:props:cards:4:materials:0:recommended\",\"minWidthCm\":112,\"weight\":\"Light, 90–150 g/m²\",\"alternatives\":[\"Upcycled bedsheet or tablecloth\"],\"why\":\"Skirt panels — softer fabrics gather and drape better.\",\"swatch\":\"#B5727D\",\"layout\":{\"mode\":\"single\",\"defaultWidth\":140,\"widths\":[112,140,150]}},{\"id\":\"elastic\",\"name\":\"Woven/knitted elastic, 3 cm wide\",\"kind\":\"notion\",\"required\":true,\"quantity\":\"{waist*0.9 + 2} of {ew} wide elastic\",\"why\":\"Holds the skirt up. Knitted or woven elastic keeps its width when stretched.\",\"swatch\":\"#F1ECE4\",\"alternatives\":[\"2.5 cm elastic (casing still fits)\"]},{\"id\":\"thread\",\"name\":\"All-purpose thread\",\"kind\":\"thread\",\"required\":true,\"quantity\":\"1 spool\",\"why\":\"Construction.\",\"swatch\":\"#3A3530\"}],\"pieces\":[{\"id\":\"panel\",\"name\":\"Skirt panel (front \u0026 back)\",\"materialId\":\"main\",\"quantity\":2,\"width\":\"max(hip*full, hip + 20)/2 + 2*sa\",\"height\":\"L + ew + 2 + hemA\",\"seamAllowance\":\"sa\",\"grain\":\"lengthwise\",\"markings\":[\"Top: casing allowance {ew + 2}\",\"Bottom: hem allowance {hemA}\"],\"notes\":\"Front and back are identical; mark the back with a safety pin.\",\"color\":\"#B5727D\"}],\"steps\":[{\"id\":\"s1\",\"stage\":\"prep\",\"title\":\"Take your measurements\",\"text\":\"Measure your waist (where you want the skirt to sit), your hip at its fullest point, and the length from your waist to where you want the hem. Enter them in 'Customise' on the project page — every piece below updates.\",\"beginner\":\"Keep the tape level all the way round and snug, not tight. Wear thin clothing. It's easier with a helper for the length.\",\"expert\":\"Waist, hip, length → enter in Customise.\",\"measurements\":[{\"label\":\"Your waist\",\"value\":\"waist\",\"unit\":\"len\"},{\"label\":\"Your hip\",\"value\":\"hip\",\"unit\":\"len\"},{\"label\":\"Skirt length\",\"value\":\"L\",\"unit\":\"len\"}],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"poly\",\"pts\":[[170,30],[230,30],[236,80],[222,110],[250,160],[244,210],[156,210],[150,160],[178,110],[164,80]],\"tone\":\"#E8DDCF\",\"label\":\"\"},{\"k\":\"stitch\",\"pts\":[[176,106],[224,106]],\"color\":\"#C66B4E\"},{\"k\":\"label\",\"x\":262,\"y\":110,\"text\":\"waist\",\"bold\":true},{\"k\":\"stitch\",\"pts\":[[150,162],[250,162]],\"color\":\"#C66B4E\"},{\"k\":\"label\",\"x\":262,\"y\":166,\"text\":\"hip (fullest)\",\"bold\":true},{\"k\":\"dim\",\"from\":[120,106],\"to\":[120,270],\"value\":\"L\",\"offset\":0},{\"k\":\"label\",\"x\":200,\"y\":290,\"text\":\"length: waist → hem\",\"anchor\":\"middle\"}]}},\"alt\":\"A simple body outline with the waist line, fullest-hip line and skirt length marked.\"},{\"id\":\"s2\",\"stage\":\"prep\",\"title\":\"Pre-wash the fabric\",\"text\":\"Wash and dry the fabric as you'll launder the skirt. Rayon and linen can shrink a lot — this matters for the length. Press it smooth.\",\"expert\":\"Pre-wash; press.\",\"techniques\":[\"prewash\",\"pressing\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":60,\"y\":70,\"w\":150,\"h\":170,\"tone\":\"main\",\"label\":\"before\"},{\"k\":\"panel\",\"x\":240,\"y\":80,\"w\":140,\"h\":155,\"tone\":\"main\",\"label\":\"after\"},{\"k\":\"arrow\",\"from\":[214,150],\"to\":[236,150]}]}},\"alt\":\"Fabric before and after pre-washing, slightly smaller after.\"},{\"id\":\"s3\",\"stage\":\"cut\",\"title\":\"Cut the two panels\",\"text\":\"Lay the fabric single-layer and cut two identical rectangles with the length running parallel to the selvedge. Mark the back panel with a safety pin.\",\"beginner\":\"These are big rectangles — use the full length of a table and check your corners are square with a large ruler or the edge of a book.\",\"expert\":\"Cut 2 panels on grain.\",\"pieces\":[\"panel\"],\"warnings\":[\"Rotary cutters are very sharp: always close the guard.\"],\"visual\":{\"type\":\"layout\",\"materialId\":\"main\"},\"alt\":\"Cutting layout with two tall skirt panels.\"},{\"id\":\"s4\",\"stage\":\"sew\",\"title\":\"Sew and finish the side seams\",\"text\":\"Place the panels right sides together and sew both side seams with a 1.5 cm seam. Neaten each pair of edges with zigzag or overlock, or press the seams open and zigzag each edge separately.\",\"expert\":\"Side seams 1.5 cm; neaten.\",\"pieces\":[\"panel\"],\"measurements\":[{\"label\":\"Seam allowance\",\"value\":\"sa\",\"unit\":\"len\"}],\"techniques\":[\"seam-allowance\",\"finishing-edges\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":80,\"y\":30,\"w\":240,\"h\":240,\"tone\":\"main\",\"side\":\"wrong\"},{\"k\":\"stitch\",\"pts\":[[94,30],[94,270]]},{\"k\":\"stitch\",\"pts\":[[306,30],[306,270]]},{\"k\":\"dim\",\"from\":[80,284],\"to\":[94,284],\"value\":\"sa\",\"offset\":0}]}},\"alt\":\"Two skirt panels right sides together with both side seams stitched.\"},{\"id\":\"s5\",\"stage\":\"sew\",\"title\":\"Press and stitch the casing\",\"text\":\"At the top edge, press 1 cm to the wrong side, then press again by the casing depth shown. Stitch close to the lower fold all the way around, leaving a 5 cm gap at one side seam for the elastic.\",\"beginner\":\"Pressing the side-seam allowances in one direction under the casing makes threading the elastic easier.\",\"expert\":\"Casing: 1 cm + (ew + 1) cm; stitch leaving 5 cm gap.\",\"pieces\":[\"panel\"],\"measurements\":[{\"label\":\"First fold\",\"value\":1,\"unit\":\"len\"},{\"label\":\"Casing depth\",\"value\":\"ew + 1\",\"unit\":\"len\"},{\"label\":\"Gap\",\"value\":5,\"unit\":\"len\"}],\"techniques\":[\"casing\",\"pressing\"],\"visual\":{\"type\":\"scene\",\"scene\":{\"els\":[{\"k\":\"panel\",\"x\":60,\"y\":70,\"w\":280,\"h\":180,
